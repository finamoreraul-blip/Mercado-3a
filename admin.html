<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center}
.btn{border:none;padding:10px 14px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-red{background:#ff3b30;color:#fff}.btn-white{background:#fff;color:#111}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee}
.card-media{height:200px;background:#000}.card-media img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px}
.log{background:#000;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;white-space:pre-wrap;margin:12px auto;max-width:1200px}
</style>
</head>
<body>
<header>
<div style="font-weight:900"><span style="color:#00a650">3A</span> VENDE ADMIN</div>
<div style="display:flex;gap:6px">
<button class="btn btn-white" onclick="location.href='index.html'">Ver Index</button>
<button class="btn btn-green" onclick="syncDesdeSheet()">↻ Sync Sheet</button>
<button class="btn btn-red" onclick="vaciarTodoAdmin()">🗑️ VACIAR TODO</button>
</div>
</header>
<div class="log" id="log">Iniciando...</div>
<div style="max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap">
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Local: <span id="count">0</span></div>
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Sheet: <span id="countSheet">0</span></div>
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Borrados: <span id="countBor">0</span></div>
<button class="btn btn-white" style="border:1px solid #ddd" onclick="limpiarLocal()">Limpiar solo mi celu</button>
</div>
<div class="feed" id="feed"></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyb_1T-3wAcKsBIYhW6XSissrzcs0nGbFWvY83YN6l9vuNBzNQrhBqdntvKbESh1v52aQ/exec";
function enviarASheet(d){ fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}); }
function getProds(){try{return JSON.parse(localStorage.getItem('marketProductsAR')||'[]')}catch(e){return[]}}
function setProds(p){localStorage.setItem('marketProductsAR',JSON.stringify(p));}

function render(){
 let all=getProds().slice().reverse();
 document.getElementById('count').textContent=all.length;
 document.getElementById('feed').innerHTML=all.map(p=>`<div class="card"><div class="card-media"><img src="${p.img||(p.media?p.media[0].src:'')}"></div><div class="card-body"><b>$${p.price.toLocaleString('es-AR')}</b><div style="font-size:12px">${p.name}</div><div style="font-size:10px;color:#888">${p.id} - ${p.storeId}</div><button class="btn btn-red" style="width:100%;margin-top:8px" onclick="borrarUno(${p.id})">Borrar en todos</button></div></div>`).join('')||'<div style="grid-column:1/-1;padding:60px;text-align:center;color:#888;background:#fff;border-radius:12px">✅ VACÍO - No hay productos</div>';
}
function borrarUno(id){
 if(!confirm('Borrar '+id+' en todos los dispositivos?'))return;
 setProds(getProds().filter(p=>String(p.id)!==String(id)));
 enviarASheet({tipo:'borrado',id:id,fecha:new Date().toLocaleString('es-AR')});
 render();
 document.getElementById('log').textContent='Borrado '+id+' enviado a borrados';
}
function limpiarLocal(){
 if(!confirm('Limpiar solo este celu?'))return;
 setProds([]);
 render();
 document.getElementById('log').textContent='Local limpiado. Dale Sync para traer del Sheet de nuevo';
}
async function vaciarTodoAdmin(){
 if(!confirm('¿VACIAR TODO EN TODOS LADOS? Se borra Sheet + todos los celus'))return;
 let all=getProds();
 for(let p of all){
   enviarASheet({tipo:'borrado',id:p.id,fecha:new Date().toLocaleString('es-AR')});
   await new Promise(r=>setTimeout(r,250));
 }
 setProds([]);
 render();
 document.getElementById('log').textContent='Se mandaron '+all.length+' a borrados. Ahora vaciá a mano la pestaña producto del Sheet y quedará en 0 definitivo en index y panel';
}
async function syncDesdeSheet(){
 try{
  document.getElementById('log').textContent='Leyendo Sheet...';
  let t=Date.now();
  let r=await fetch(SHEET_URL+"?tipo=producto&t="+t).then(x=>x.json());
  let rb=await fetch(SHEET_URL+"?tipo=borrado&t="+t).then(x=>x.json()).catch(()=>[]);
  let borrados=new Set(rb.map(x=>String(x.id)));
  document.getElementById('countSheet').textContent=r.length;
  document.getElementById('countBor').textContent=borrados.size;
  let delSheet=r.filter(x=>x.id&&x.imagen&&!borrados.has(String(x.id))).map(x=>({
    id:parseInt(x.id),storeId:x.storeId,store:x.tienda,name:x.producto,price:parseInt(x.precio)||0,img:x.imagen,media:[{src:x.imagen}],category:x.categoria,desc:x.descripcion
  }));
  setProds(delSheet);
  render();
  document.getElementById('log').textContent='Sync OK: Sheet='+r.length+' Borrados='+borrados.size+' Final='+delSheet.length+(delSheet.length===0?' ✅ VACIO TOTAL':'');
 }catch(e){ document.getElementById('log').textContent='Error: '+e.message; }
}
render();
syncDesdeSheet();
setInterval(syncDesdeSheet,10000);
</script>
</body>
</html>
