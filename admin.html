<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN - 3A VENDE - Solo Sheet</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#111;color:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center}
.btn{border:none;padding:10px 14px;border-radius:8px;font-weight:800;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-red{background:#ff3b30;color:#fff}.btn-white{background:#fff;color:#111}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;padding:16px;max-width:1200px;margin:0 auto}
.card{background:#fff;border-radius:12px;overflow:hidden;border:1px solid #eee}
.card-media{height:200px;background:#000}.card-media img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px}
.log{background:#111;color:#0f0;padding:12px;border-radius:10px;font-family:monospace;font-size:11px;white-space:pre-wrap;margin:12px auto;max-width:1200px}
</style>
</head>
<body>
<header>
<div style="font-weight:900"><span style="color:#00a650">3A</span> VENDE ADMIN - SHEET</div>
<div style="display:flex;gap:6px">
<button class="btn btn-white" onclick="location.href='index.html'">Ver Index</button>
</div>
</header>
<div class="log" id="log">Conectando solo a Sheet...</div>
<div style="max-width:1200px;margin:0 auto;padding:0 16px;display:flex;gap:12px;flex-wrap:wrap">
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Sheet: <span id="countSheet">0</span></div>
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Borrados: <span id="countBor">0</span></div>
<div style="background:#fff;padding:10px 14px;border-radius:999px;font-size:12px;font-weight:800">Mostrando: <span id="count">0</span></div>
<div style="background:#00a650;color:#fff;padding:10px 14px;border-radius:999px;font-size:11px;font-weight:800">✅ Solo Sheet - Si borrás acá, queda en 0 en index y panel</div>
</div>
<div class="feed" id="feed"></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyb_1T-3wAcKsBIYhW6XSissrzcs0nGbFWvY83YN6l9vuNBzNQrhBqdntvKbESh1v52aQ/exec";
function enviarASheet(d){ fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}); }

// Limpieza total de cache viejo
localStorage.removeItem('marketProductsAR');
localStorage.removeItem('marketProducts');
localStorage.removeItem('3a_prods_cache');

let DB = [];

function render(){
 document.getElementById('count').textContent=DB.length;
 document.getElementById('feed').innerHTML=DB.map(p=>`<div class="card"><div class="card-media"><img src="${p.imagen}"></div><div class="card-body"><b>$${(parseInt(p.precio)||0).toLocaleString('es-AR')}</b><div style="font-size:12px">${p.producto}</div><div style="font-size:10px;color:#888">${p.id} - ${p.storeId}</div><div style="font-size:10px;color:#888">${p.tienda}</div><button class="btn btn-red" style="width:100%;margin-top:8px" onclick="borrarUno(${p.id})">Borrar del Sheet</button></div></div>`).join('')||'<div style="grid-column:1/-1;padding:60px;text-align:center;color:#888;background:#fff;border-radius:12px">✅ VACÍO TOTAL - 0 productos en Sheet<br><small>index.html y panel.html también están en 0 ahora</small></div>';
}

function borrarUno(id){
 if(!confirm('¿Borrar ID '+id+' del Sheet? Se borra en TODOS lados'))return;
 enviarASheet({tipo:'borrado',id:id,fecha:new Date().toLocaleString('es-AR')});
 document.getElementById('log').textContent='Borrando '+id+' del Sheet...';
 setTimeout(cargarSheet,1500);
}

async function cargarSheet(){
 try{
  document.getElementById('log').textContent='Leyendo Sheet...';
  let t=Date.now();
  let r=await fetch(SHEET_URL+"?tipo=producto&t="+t).then(x=>x.json());
  let rb=await fetch(SHEET_URL+"?tipo=borrado&t="+t).then(x=>x.json()).catch(()=>[]);
  let borrados=new Set(rb.map(x=>String(x.id)));
  document.getElementById('countSheet').textContent=r.length;
  document.getElementById('countBor').textContent=borrados.size;
  DB=r.filter(x=>x.id && x.imagen && !borrados.has(String(x.id)));
  render();
  document.getElementById('log').textContent='Sheet='+r.length+' Borrados='+borrados.size+' Final='+DB.length+(DB.length===0?' ✅ VACIO TOTAL EN TODA LA APP':'');
 }catch(e){ document.getElementById('log').textContent='Error: '+e.message; }
}

cargarSheet();
setInterval(cargarSheet,10000);
</script>
</body>
</html>
