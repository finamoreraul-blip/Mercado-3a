<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f3f5}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.logo b{color:#00a650}
.btn{border:none;padding:10px 16px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-black{background:#111;color:#fff}.btn-gray{background:#fff;border:1px solid #ddd}.btn-red{background:#ff3b30;color:#fff}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:320px 1fr;gap:16px}
.card{background:#fff;border-radius:16px;padding:18px;border:1px solid #eee}
label{font-size:11px;font-weight:800;display:block;margin-top:12px;margin-bottom:4px;text-transform:uppercase}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#fafafa;outline:none}
textarea{height:70px;resize:none}
.upload{border:2px dashed #ccc;border-radius:12px;padding:12px;text-align:center;margin-top:8px;cursor:pointer;background:#fafafa}
.upload:hover{border-color:#00a650;background:#f6fdf8}
.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.preview-item{position:relative;height:80px;background:#000;border-radius:8px;overflow:hidden}
.preview-item img,.preview-item video{width:100%;height:100%;object-fit:cover}
.preview-item span{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.7);color:#fff;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.prod{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee}
.prod-media{height:160px;background:#000;display:flex;align-items:center;justify-content:center}
.prod-media img{width:100%;height:100%;object-fit:cover}
.prod-body{padding:10px}
.prod-actions{display:flex;gap:6px;margin-top:8px}
.prod-actions button{flex:1;padding:8px;border-radius:8px;font-size:11px}
.hidden{display:none!important}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='index.html'">Market</button><button class="btn btn-black" id="btnMiTienda" onclick="irTienda()">Mi tienda</button></div>
</header>

<div class="wrap">
<div>
<div class="card">
<h3 style="font-weight:900">Nueva publicación</h3>
<div id="storeInfo" style="font-size:11px;color:#666;margin-top:4px;background:#f9fafb;padding:8px;border-radius:8px">Cargando tienda...</div>

<label>Título *</label><input id="pName" placeholder="Ej: Zapatillas Nike">
<label>Precio *</label><input id="pPrice" type="number" placeholder="15000">
<label>Categoría</label>
<select id="pCat"><option value="">Elegí</option><option>Ropa</option><option>Calzado</option><option>Makeup</option><option>Tecnología</option><option>Hogar</option><option>Otros</option></select>
<label>Descripción</label><textarea id="pDesc" placeholder="Detalles, talle, estado..."></textarea>

<label>Fotos / Videos *</label>
<div class="upload" onclick="document.getElementById('fileMedia').click()">
<div style="font-weight:800;font-size:12px">📸 TOCÁ PARA SUBIR FOTOS / VIDEO</div><div style="font-size:11px;color:#888;margin-top:2px">Podés subir varias, hasta 10</div>
</div>
<input type="file" id="fileMedia" accept="image/*,video/*" multiple class="hidden">
<div class="preview" id="preview"></div>

<button class="btn btn-green" style="width:100%;margin-top:14px;padding:14px" id="btnPublicar" onclick="publicar()">📦 PUBLICAR</button>
<button class="btn btn-gray hidden" style="width:100%;margin-top:8px" id="btnCancelar" onclick="cancelarEdicion()">Cancelar edición</button>

<div id="msg" style="font-size:12px;margin-top:10px"></div>
</div>

<div class="card" style="margin-top:12px">
<div style="font-weight:900;font-size:13px">Mi tienda</div>
<div style="font-size:12px;margin-top:8px;color:#555" id="sideStoreInfo"></div>
<button class="btn btn-black" style="width:100%;margin-top:10px" onclick="irTienda()">✏️ Editar tienda (fotos, desc)</button>
</div>
</div>

<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="font-weight:900">Mis publicaciones (<span id="count">0</span>)</h3>
<button class="btn btn-gray" style="font-size:11px" onclick="cargarProds()">↻ Recargar</button>
</div>
<div class="grid" id="grid"></div>
</div>
</div>

<script>
var curStoreId=null;
var mediaTemp=[]; // {type, src}
var editId=null;

function getStores(){try{return JSON.parse(localStorage.getItem('marketStores')||'{}')}catch(e){return{}}}
function setStores(o){localStorage.setItem('marketStores',JSON.stringify(o))}
function getProds(){try{return JSON.parse(localStorage.getItem('marketProductsAR')||'[]')}catch(e){return[]}}
function setProds(p){localStorage.setItem('marketProductsAR',JSON.stringify(p))}
function getUsers(){try{return JSON.parse(localStorage.getItem('marketUsers')||'{}')}catch(e){return{}}}

function init(){
  var wsp=localStorage.getItem('currentUser');
  var users=getUsers();
  var stores=getStores();
  if(!wsp ||!users[wsp]){
    document.getElementById('storeInfo').innerHTML='No logueado. <a href="index.html" style="color:#00a650;font-weight:800">Ir al market</a>';
    return;
  }
  curStoreId=users[wsp].storeId;
  if(!curStoreId){
    var keys=Object.keys(stores);
    if(keys.length>0) curStoreId=keys[0];
  }
  var s=stores[curStoreId];
  if(!s){
    // auto crear si no existe
    s={id:users[wsp].storeId||'store_'+Date.now(),name:users[wsp].storeName||'Mi tienda',wsp:wsp,dir:'Tres Arroyos',created:Date.now(),trialStart:Date.now()};
    stores[s.id]=s;
    curStoreId=s.id;
    users[wsp].storeId=s.id;
    setStores(stores);
    localStorage.setItem('marketUsers',JSON.stringify(users));
  }
  document.getElementById('storeInfo').innerHTML='Publicando en: <b>'+s.name+'</b><br>ID: '+s.id+'<br>Wsp: '+s.wsp;
  document.getElementById('sideStoreInfo').innerHTML='<b>'+s.name+'</b><br>'+s.dir+'<br>Wsp: '+s.wsp;
  document.getElementById('btnMiTienda').onclick=function(){location.href='store.html?store='+curStoreId};
  cargarProds();
}

function toBase64(file,cb){
  var r=new FileReader();
  r.onload=function(e){cb(e.target.result)};
  r.readAsDataURL(file);
}

document.getElementById('fileMedia').addEventListener('change',function(e){
  var files=e.target.files;
  if(!files.length) return;
  if(mediaTemp.length+files.length>10){alert('Máx 10 archivos');return}
  for(let i=0;i<files.length;i++){
    let f=files[i];
    if(f.size>15*1024*1024){alert(f.name+' muy pesado (máx 15MB)');continue}
    let type=f.type.startsWith('video')?'video':'img';
    toBase64(f,function(b64){
      mediaTemp.push({type:type,src:b64});
      renderPreview();
    });
  }
  e.target.value='';
});

function renderPreview(){
  var html='';
  for(let i=0;i<mediaTemp.length;i++){
    let m=mediaTemp[i];
    html+='<div class="preview-item">'+(m.type==='video'?'<video src="'+m.src+'" muted></video>':'<img src="'+m.src+'">')+'<span onclick="mediaTemp.splice('+i+',1);renderPreview()">✕</span></div>';
  }
  document.getElementById('preview').innerHTML=html;
}

function publicar(){
  var name=document.getElementById('pName').value.trim();
  var price=parseInt(document.getElementById('pPrice').value);
  var cat=document.getElementById('pCat').value;
  var desc=document.getElementById('pDesc').value.trim();

  if(!curStoreId){alert('No hay tienda');return}
  if(!name){alert('Poné título');return}
  if(!price||price<=0){alert('Poné precio');return}
  if(mediaTemp.length===0 &&!editId){alert('Subí al menos 1 foto');return}

  var prods=getProds();
  var stores=getStores();
  var s=stores[curStoreId];

  if(editId){
    var idx=prods.findIndex(function(p){return p.id===editId});
    if(idx>-1){
      prods[idx].name=name;
      prods[idx].price=price;
      prods[idx].category=cat;
      prods[idx].desc=desc;
      if(mediaTemp.length>0){
        prods[idx].media=mediaTemp;
        prods[idx].img=mediaTemp[0].src;
        prods[idx].imgs=mediaTemp.map(function(m){return m.src});
      }
    }
    setProds(prods);
    document.getElementById('msg').textContent='✅ Publicación actualizada';
    cancelarEdicion();
    cargarProds();
    return;
  }

  var nuevo={
    id:Date.now(),
    storeId:curStoreId,
    store:s.name,
    name:name,
    price:price,
    category:cat,
    desc:desc,
    media:mediaTemp,
    img:mediaTemp[0].src,
    imgs:mediaTemp.map(function(m){return m.src}),
    created:Date.now()
  };
  prods.push(nuevo);
  setProds(prods);

  document.getElementById('pName').value='';
  document.getElementById('pPrice').value='';
  document.getElementById('pCat').value='';
  document.getElementById('pDesc').value='';
  mediaTemp=[];
  renderPreview();
  document.getElementById('msg').textContent='✅ Publicado! Ya aparece en tu tienda';
  cargarProds();
}

function cargarProds(){
  if(!curStoreId) return;
  var prods=getProds().filter(function(p){return p.storeId===curStoreId}).sort(function(a,b){return b.id-a.id});
  document.getElementById('count').textContent=prods.length;
  var html='';
  for(let i=0;i<prods.length;i++){
    let p=prods[i];
    let img=p.img||(p.imgs?p.imgs[0]:'');
    if(p.media&&p.media[0]) img=p.media[0].src;
    html+='<div class="prod"><div class="prod-media"><img src="'+img+'" loading="lazy"></div><div class="prod-body"><div style="font-weight:900">$'+p.price.toLocaleString('es-AR')+'</div><div style="font-size:12px;margin-top:2px">'+p.name+'</div><div class="prod-actions"><button class="btn btn-gray" onclick="editar('+p.id+')">Editar</button><button class="btn btn-red" onclick="borrar('+p.id+')">Borrar</button></div></div></div>';
  }
  document.getElementById('grid').innerHTML=html||'<div style="grid-column:1/-1;background:#fff;padding:30px;border-radius:12px;text-align:center;color:#888">Aún no publicaste nada</div>';
}

function editar(id){
  var prods=getProds();
  var p=prods.find(function(x){return x.id===id});
  if(!p) return;
  editId=id;
  document.getElementById('pName').value=p.name;
  document.getElementById('pPrice').value=p.price;
  document.getElementById('pCat').value=p.category||'';
  document.getElementById('pDesc').value=p.desc||'';
  mediaTemp=p.media||(p.imgs?p.imgs.map(function(src){return{type:'img',src:src}}):[{type:'img',src:p.img}]);
  renderPreview();
  document.getElementById('btnPublicar').textContent='💾 GUARDAR CAMBIOS';
  document.getElementById('btnCancelar').classList.remove('hidden');
  window.scrollTo(0,0);
  document.getElementById('msg').textContent='Editando: '+p.name;
}

function cancelarEdicion(){
  editId=null;
  mediaTemp=[];
  renderPreview();
  document.getElementById('pName').value='';
  document.getElementById('pPrice').value='';
  document.getElementById('pCat').value='';
  document.getElementById('pDesc').value='';
  document.getElementById('btnPublicar').textContent='📦 PUBLICAR';
  document.getElementById('btnCancelar').classList.add('hidden');
  document.getElementById('msg').textContent='';
}

function borrar(id){
  if(!confirm('¿Borrar esta publicación?')) return;
  var prods=getProds();
  prods=prods.filter(function(p){return p.id!==id});
  setProds(prods);
  cargarProds();
}

function irTienda(){
  if(!curStoreId){alert('No hay tienda');return}
  location.href='store.html?store='+curStoreId;
}

window.onload=init;
</script>
</body>
</html>
