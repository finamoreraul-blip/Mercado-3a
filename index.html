<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A VENDE - Marketplace Tres Arroyos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Proxima Nova,Arial,sans-serif}
body{background:#f5f5f5;color:#333}
header{background:#fff;padding:12px 16px;position:sticky;top:0;z-index:20;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1200px;margin:0 auto}
.logo{font-weight:900;font-size:22px;cursor:pointer}.logo b{color:#00a650}
.search{flex:1;max-width:420px;margin:0 16px;position:relative}
.search input{width:100%;padding:10px 14px 10px 36px;border-radius:999px;border:1px solid #e5e5e5;background:#f5f5f5;font-size:13px;outline:none}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:#888}
.btn{border:none;padding:8px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-gray{background:#f5f5f5;border:1px solid #e5e5e5}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 0;max-width:1200px;margin:0 auto;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{padding:7px 14px;border-radius:999px;border:1px solid #e5e5e5;background:#fff;font-size:12px;font-weight:600;white-space:nowrap;cursor:pointer;transition:.2s}
.cat.active{background:#111;color:#fff;border-color:#111}
.wrap{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:220px 1fr;gap:16px}
.sidebar{background:#fff;border-radius:12px;padding:14px;height:fit-content;position:sticky;top:84px}
.sidebar h3{font-size:12px;font-weight:800;margin-bottom:10px}
.store-mini{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer;transition:.2s}
.store-mini:hover{background:#f5f5f5}
.store-mini img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.store-mini b{font-size:11px;display:block}.store-mini span{font-size:10px;color:#888}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;transition:.2s;position:relative}
.card:hover{box-shadow:0 4px 16px rgba(0,0,0,.1);transform:translateY(-2px)}
.card-media{position:relative;height:220px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:8px;left:8px;background:#111;color:#fff;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:800}
.card-badge.video{background:#00a650}
.card-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px}
.dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5)}.dot.on{background:#fff}
.card-body{padding:10px}
.card-price{font-weight:800;font-size:15px}.card-name{font-size:12px;margin-top:2px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-store{font-size:10px;color:#888;margin-top:4px;display:flex;align-items:center;gap:4px}
.card-store img{width:14px;height:14px;border-radius:50%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal-media{background:#000;display:flex;align-items:center;justify-content:center;min-height:400px;position:relative}
.modal-media img,.modal-media video{width:100%;height:100%;object-fit:contain;max-height:70vh}
.modal-body{padding:20px}
.modal-price{font-size:24px;font-weight:900}.modal-name{font-size:16px;font-weight:700;margin-top:6px}.modal-desc{font-size:13px;color:#555;margin-top:12px;line-height:1.5;white-space:pre-wrap}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.8);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:2}
.arrow.l{left:10px}.arrow.r{right:10px}
.close{position:absolute;top:10px;right:10px;background:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:3}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.sidebar{display:none}.modal-box{grid-template-columns:1fr}.feed{grid-template-columns:repeat(2,1fr);gap:10px}.card-media{height:180px}}
</style>
</head>
<body>
<header>
<div class="top">
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div class="search"><span>🔍</span><input id="q" placeholder="Buscar productos, tiendas..." oninput="render()"></div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='panel.html'">Vender</button><button class="btn btn-green" onclick="location.href='panel.html'">Mi panel</button></div>
</div>
<div class="cats" id="cats">
<div class="cat active" onclick="setCat('todos',this)">Todos</div>
<div class="cat" onclick="setCat('maquillaje',this)">💄 Maquillaje</div>
<div class="cat" onclick="setCat('limpieza',this)">🧹 Limpieza</div>
<div class="cat" onclick="setCat('comida',this)">🍔 Comida</div>
<div class="cat" onclick="setCat('clothing',this)">👕 Ropa</div>
<div class="cat" onclick="setCat('verduleria',this)">🥬 Verdulería</div>
<div class="cat" onclick="setCat('carniceria',this)">🥩 Carnicería</div>
</div>
</header>

<div class="wrap">
<div class="sidebar">
<h3>Tiendas en Tres Arroyos</h3>
<div id="storeList"></div>
<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee">
<div style="font-size:11px;color:#888">¿Tenés tienda?</div>
<a href="panel.html" style="font-size:12px;color:#00a650;font-weight:700;text-decoration:none">Publicá gratis 10 días →</a>
<div style="font-size:10px;color:#888;margin-top:6px">Después $4.500/mes o 10% por venta</div>
</div>
</div>

<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<div style="font-size:12px;color:#888"><span id="count">0</span> publicaciones</div>
<div style="font-size:11px;color:#888">Tres Arroyos • Envíos y retiros</div>
</div>
<div class="feed" id="feed"></div>
</div>
</div>

<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
<div class="modal-box">
<div class="modal-media" id="modalMedia"></div>
<div class="modal-body">
<div style="display:flex;justify-content:space-between;align-items:center"><div style="display:flex;gap:8px;align-items:center"><img id="mStoreImg" src="" style="width:28px;height:28px;border-radius:50%"><b id="mStore" style="font-size:12px"></b></div><div class="close" onclick="closeModal()">✕</div></div>
<div class="modal-price" id="mPrice" style="margin-top:14px"></div>
<div class="modal-name" id="mName"></div>
<div class="modal-desc" id="mDesc"></div>
<div style="margin-top:16px;display:flex;gap:8px"><button class="btn btn-green" style="flex:1;padding:12px" onclick="contactWsp()">WhatsApp</button><button class="btn btn-gray" style="flex:1;padding:12px" onclick="goStore()">Ver tienda</button></div>
<div style="margin-top:10px;font-size:11px;color:#888">Publicado en 3A VENDE • Tres Arroyos</div>
</div>
</div>
</div>

<script>
// ADMIN LOG
function logMov(tipo, accion, detalle){
try{
let logs=JSON.parse(localStorage.getItem('adminLogs')||'[]');
logs.push({id:Date.now(),fecha:new Date().toLocaleString('es-AR'),tipo,accion,detalle,store:localStorage.getItem('currentUser')||'visitante',url:location.pathname});
if(logs.length>5000) logs=logs.slice(-5000);
localStorage.setItem('adminLogs',JSON.stringify(logs));
}catch(e){}
}
logMov('INDEX','visita','Entró al marketplace');

let curCat='todos', curProd=null, curIdx=0;

function getStores(){return JSON.parse(localStorage.getItem('marketStores')||'{}')}
function getProds(){return JSON.parse(localStorage.getItem('marketProductsAR')||'[]')}

function isStoreActive(storeId){
let stores=getStores();let s=stores[storeId];if(!s) return false;
let now=Date.now();
if(s.paid && s.paidUntil && now < s.paidUntil) return true;
if(s.plan==='comision') return true;
let start=s.trialStart||now;
let diff=Math.floor((now-start)/(1000*60*60*24));
return diff<=10;
}

function setCat(c,el){
curCat=c;
document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
logMov('INDEX','click_menu','Categoría: '+c);
render();
}

function render(){
let all=getProds().slice().sort((a,b)=>b.id-a.id);
let q=document.getElementById('q').value.toLowerCase();

// solo tiendas activas (trial 10 días o pagas o 10%)
all=all.filter(p=> isStoreActive(p.storeId) );

if(curCat!=='todos') all=all.filter(p=>p.category===curCat);
if(q) all=all.filter(p=> p.name.toLowerCase().includes(q) || p.store.toLowerCase().includes(q) || (p.desc||'').toLowerCase().includes(q));

document.getElementById('count').textContent=all.length;
document.getElementById('feed').innerHTML=all.map(p=>{
let stores=getStores();let st=stores[p.storeId];
let first=p.media?p.media[0]:{type:'img',src:p.img};
let isVideo=first.type==='video';
let count=(p.media?p.media.length:(p.imgs?p.imgs.length:1));
return `<div class="card" onclick="openModal(${p.id})">
<div class="card-media">
${isVideo?`<video src="${first.src}" muted></video>`:`<img src="${p.imgs?p.imgs[0]:p.img}" loading="lazy">`}
<div class="card-badge ${isVideo?'video':''}">${isVideo?'VIDEO':''} ${count>1?'• '+count:''}</div>
${count>1?`<div class="card-dots">${Array(count).fill(0).map((_,i)=>`<div class="dot ${i===0?'on':''}"></div>`).join('')}</div>`:''}
</div>
<div class="card-body">
<div class="card-price">$${p.price.toLocaleString('es-AR')}</div>
<div class="card-name">${p.name}</div>
<div class="card-store"><img src="${st?st.profile:'https://via.placeholder.com/40'}">${p.store}</div>
</div>
</div>`;
}).join('')||`<div style="grid-column:1/-1;text-align:center;padding:40px;color:#888">No hay publicaciones en esta categoría<br><a href="panel.html" style="color:#00a650">¡Sé el primero en publicar!</a></div>`;

let stores=getStores();
let activeStores=Object.entries(stores).filter(([id])=> isStoreActive(id));
document.getElementById('storeList').innerHTML=activeStores.slice(0,12).map(([id,s])=>`
<div class="store-mini" onclick="location.href='store.html?store=${id}'">
<img src="${s.profile}"><div><b>${s.name}</b><span>${s.dir||'Tres Arroyos'}</span></div>
</div>`).join('')||'<div style="font-size:11px;color:#999">Aún no hay tiendas</div>';
}

function openModal(id){
let p=getProds().find(x=>x.id===id);if(!p) return;
curProd=p;curIdx=0;
let stores=getStores();let st=stores[p.storeId];
document.getElementById('mStore').textContent=p.store;
document.getElementById('mStoreImg').src=st?st.profile:'';
document.getElementById('mPrice').textContent='$'+p.price.toLocaleString('es-AR');
document.getElementById('mName').textContent=p.name;
document.getElementById('mDesc').textContent=p.desc||'Sin descripción';
showModalMedia();
document.getElementById('modal').style.display='flex';
logMov('INDEX','ver_producto',p.name+' - '+p.store+' $'+p.price);
}
function showModalMedia(){
let media=curProd.media|| (curProd.imgs?curProd.imgs.map(src=>({type:'img',src})): [{type:'img',src:curProd.img}]);
let m=media[curIdx];
document.getElementById('modalMedia').innerHTML=`
${m.type==='video'?`<video src="${m.src}" controls autoplay style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${m.src}" style="width:100%;height:100%;object-fit:contain">`}
${media.length>1?`<div class="arrow l" onclick="event.stopPropagation();curIdx=(curIdx-1+media.length)%media.length;showModalMedia()">‹</div><div class="arrow r" onclick="event.stopPropagation();curIdx=(curIdx+1)%media.length;showModalMedia()">›</div><div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px">${curIdx+1}/${media.length}</div>`:''}
`;
}
function closeModal(){document.getElementById('modal').style.display='none';}
function contactWsp(){
let stores=getStores();let s=stores[curProd.storeId];
if(!s) return;
logMov('INDEX','click_whatsapp','WhatsApp a '+curProd.store+' por '+curProd.name);
let msg=encodeURIComponent(`Hola! Vi ${curProd.name} por $${curProd.price} en 3A VENDE. ¿Sigue disponible?`);
window.open(`https://wa.me/54${s.wsp.replace(/\D/g,'')}?text=${msg}`,'_blank');
}
function goStore(){logMov('INDEX','ver_tienda','Fue a tienda '+curProd.storeId);location.href='store.html?store='+curProd.storeId;}

render();
</script>
</body>
</html>
