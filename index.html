<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3A VENDE - Marketplace Tres Arroyos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Proxima Nova,Arial,sans-serif}
body{background:#f5f5f5;color:#333}
header{background:#fff;padding:12px 16px;position:sticky;top:0;z-index:30;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.top{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;cursor:pointer}.logo b{color:#00a650}
.search{flex:1;max-width:420px;margin:0 16px;position:relative}
.search input{width:100%;padding:11px 14px 11px 36px;border-radius:999px;border:1px solid #e5e5e5;background:#f5f5f5;font-size:13px;outline:none}
.search span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:14px;color:#888}
.btn{border:none;padding:8px 14px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-gray{background:#f5f5f5;border:1px solid #e5e5e5}.btn-black{background:#111;color:#fff}
.cat{padding:8px 14px;border-radius:999px;border:1px solid #e5e5e5;background:#fff;font-size:12px;font-weight:700;white-space:nowrap;cursor:pointer}
.cat.active{background:#111;color:#fff;border-color:#111}
.wrap{max-width:1200px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:220px 1fr;gap:16px}
.sidebar{background:#fff;border-radius:12px;padding:14px;height:fit-content;position:sticky;top:84px}
.sidebar h3{font-size:12px;font-weight:800;margin-bottom:10px}
.store-mini{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.store-mini:hover{background:#f5f5f5}
.store-mini img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.store-mini b{font-size:11px;display:block}.store-mini span{font-size:10px;color:#888}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:.2s;position:relative}
.card:hover{box-shadow:0 8px 24px rgba(0,0,0,.12);transform:translateY(-4px)}
.card-media{position:relative;height:320px;background:#000;overflow:hidden}
.track{display:flex;width:100%;height:100%;transition:transform.35s ease}
.slide{min-width:100%;height:100%;flex-shrink:0;background:#000}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block}
.card-badge{position:absolute;top:10px;left:10px;background:#111;color:#fff;padding:6px 10px;border-radius:999px;font-size:10px;font-weight:800;z-index:2}
.card-badge.video{background:#00a650}
.card-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.5);padding:6px 12px;border-radius:999px;z-index:2}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.6);transition:.2s}.dot.on{background:#fff;width:18px}
.card-arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.85);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:3;border:none}
.card-arrow.l{left:8px}.card-arrow.r{right:8px}
.card-body{padding:14px}
.card-price{font-weight:900;font-size:18px}.card-name{font-size:14px;margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-store{font-size:11px;color:#888;margin-top:6px;display:flex;align-items:center;gap:5px}
.card-store img{width:18px;height:18px;border-radius:50%}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal-media{background:#000;display:flex;align-items:center;justify-content:center;min-height:400px;position:relative}
.modal-media img,.modal-media video{width:100%;height:100%;object-fit:contain;max-height:70vh}
.modal-body{padding:20px}
.modal-price{font-size:24px;font-weight:900}.modal-name{font-size:16px;font-weight:700;margin-top:6px}.modal-desc{font-size:13px;color:#555;margin-top:12px;line-height:1.5;white-space:pre-wrap}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.9);width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:2}
.arrow.l{left:12px}.arrow.r{right:12px}
.close{position:absolute;top:10px;right:10px;background:#fff;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800;z-index:3}
.checkout{border-top:1px solid #eee;margin-top:14px;padding-top:14px}
.checkout input,.checkout select,.checkout textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid #ddd;background:#fafafa;font-size:13px;margin-top:8px;outline:none}
.hidden{display:none!important}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.sidebar{display:none}.modal-box{grid-template-columns:1fr}.feed{grid-template-columns:repeat(2,1fr);gap:10px}.card-media{height:220px}.search{max-width:160px;margin:0 8px}}
</style>
</head>
<body>
<header>
<div class="top">
<div style="display:flex;gap:12px;align-items:center">
<div style="position:relative">
<button onclick="document.getElementById('menuLeft').classList.toggle('hidden')" style="border:none;background:#f5f5f5;width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;font-weight:800">⋮</button>
<div id="menuLeft" class="hidden" style="position:absolute;left:0;top:48px;background:#fff;border-radius:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;z-index:50;min-width:240px;border:1px solid #eee">
<div style="font-size:11px;color:#888;font-weight:800;padding:6px 10px">MENÚ</div>
<div class="cat" onclick="setCat('todos',this);document.getElementById('menuLeft').classList.add('hidden')" style="margin:4px 0">🛍️ Productos</div>
<div class="cat" onclick="document.getElementById('menuLeft').classList.add('hidden');document.getElementById('tiendas').scrollIntoView({behavior:'smooth'})" style="margin:4px 0">🏪 Tiendas</div>
<div style="height:1px;background:#eee;margin:10px 0"></div>
<a href="panel.html" style="display:block;text-align:center;background:#00a650;color:#fff;padding:12px;border-radius:999px;font-size:12px;font-weight:800;text-decoration:none">+ Publicar gratis</a>
</div>
</div>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
</div>
<div style="display:flex;gap:8px;align-items:center">
<div class="search"><span>🔍</span><input id="q" placeholder="Buscar..." oninput="render()"></div>
<button class="btn btn-green" id="btnPanel" onclick="irPanel()">Mi panel</button>
</div>
</div>
</header>
<div style="max-width:1200px;margin:16px auto;padding:0 16px">
<div style="background:linear-gradient(135deg,#00a650 0%,#00c853 100%);border-radius:20px;padding:32px 20px;text-align:center;color:#fff">
<h1 style="font-size:28px;font-weight:900">3A VENDE</h1>
<p style="font-size:13px;margin-top:6px;opacity:.9">Todo Tres Arroyos en un solo lugar • Solo vista</p>
<div style="margin-top:14px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<span id="syncStatus" style="background:rgba(0,0,0,.3);padding:6px 14px;border-radius:999px;font-size:11px;font-weight:700">↻ Cargando Sheet...</span>
</div>
</div>
</div>
<div class="wrap">
<div class="sidebar" id="tiendas"><h3>Tiendas verificadas (Sheet)</h3><div id="storeList"></div></div>
<div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:12px;color:#888"><span id="count">0</span> publicaciones</div><button class="btn btn-gray" onclick="syncDesdeSheet()" style="font-size:10px">↻ Sync</button></div><div class="feed" id="feed"></div></div>
</div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()"><div class="modal-box"><div class="modal-media" id="modalMedia"></div><div class="modal-body"><div style="display:flex;justify-content:space-between"><div style="display:flex;gap:8px;align-items:center"><img id="mStoreImg" src="" style="width:28px;height:28px;border-radius:50%"><b id="mStore" style="font-size:12px"></b></div><div class="close" onclick="closeModal()">✕</div></div><div class="modal-price" id="mPrice" style="margin-top:14px"></div><div class="modal-name" id="mName"></div><div class="modal-desc" id="mDesc"></div><div style="margin-top:16px;display:grid;grid-template-columns:1fr 1fr;gap:8px"><button class="btn btn-green" style="padding:13px" onclick="abrirCheckout()">🛒 COMPRAR</button><button class="btn btn-gray" style="padding:13px" onclick="contactWsp()">💬 Consultar</button></div><button class="btn btn-black" style="width:100%;margin-top:8px;padding:11px" onclick="goStore()">Ver tienda</button><div id="checkout" class="checkout hidden"><div style="font-weight:900;font-size:14px">Finalizar pedido</div><input id="cNombre" placeholder="Tu nombre *"><input id="cWsp" placeholder="Tu WhatsApp *"><div style="display:grid;grid-template-columns:90px 1fr;gap:8px"><input id="cCant" type="number" value="1" min="1"><select id="cEntrega"><option>Envío a domicilio</option><option>Retiro en local</option></select></div><input id="cDir" placeholder="Dirección"><select id="cPago"><option>Efectivo</option><option>Transferencia</option></select><textarea id="cNota" placeholder="Nota..." style="height:60px"></textarea><div id="cResumen" style="background:#f9fafb;padding:10px;border-radius:10px;margin-top:10px;font-size:12px;font-weight:700"></div><button class="btn btn-green" style="width:100%;padding:14px;margin-top:10px" onclick="enviarPedidoWsp()">📲 Enviar pedido</button></div></div></div></div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyb_1T-3wAcKsBIYhW6XSissrzcs0nGbFWvY83YN6l9vuNBzNQrhBqdntvKbESh1v52aQ/exec";
function enviarASheet(d){ try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}); }catch(e){} }
function getStores(){try{return JSON.parse(localStorage.getItem('marketStores')||'{}')}catch(e){return{}}}
function getPedidos(){try{return JSON.parse(localStorage.getItem('marketPedidos')||'[]')}catch(e){return[]}}
function setPedidos(p){localStorage.setItem('marketPedidos',JSON.stringify(p))}

let DB = [];
let curCat='todos',curProd=null,curIdx=0;
let carIdx={}, carTimers={};

function irPanel(){var wsp=localStorage.getItem('currentUser');var users=JSON.parse(localStorage.getItem('marketUsers')||'{}');if(!wsp ||!users[wsp]){location.href='login.html';}else{location.href='panel.html';}}
function updatePanelBtn(){var wsp=localStorage.getItem('currentUser');var users=JSON.parse(localStorage.getItem('marketUsers')||'{}');var btn=document.getElementById('btnPanel');if(wsp && users[wsp]){btn.textContent='Mi panel';btn.className='btn btn-black';}else{btn.textContent='Entrar';btn.className='btn btn-green';}}
function setCat(c,el){curCat=c;document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));if(el) el.classList.add('active');render();}

function render(){
let all=DB.slice().sort((a,b)=>b.id-a.id);
let q=(document.getElementById('q').value||'').toLowerCase();
if(curCat!=='todos') all=all.filter(p=> (p.category||'').toLowerCase()===curCat.toLowerCase());
if(q) all=all.filter(p=>p.name.toLowerCase().includes(q)||p.store.toLowerCase().includes(q));
document.getElementById('count').textContent=all.length;
document.getElementById('feed').innerHTML=all.map(p=>{
let st=getStores()[p.storeId] || {profile:'https://via.placeholder.com/40', name:p.store};
let total=p.media.length;
let dots = total>1? `<div class="card-dots" id="dots-${p.id}">${p.media.map((_,k)=>`<div class="dot ${k==0?'on':''}"></div>`).join('')}</div>` : '';
let arrows = total>1? `<button class="card-arrow l" onclick="event.stopPropagation();moverCard(${p.id},-1)">‹</button><button class="card-arrow r" onclick="event.stopPropagation();moverCard(${p.id},1)">›</button>` : '';
return `<div class="card">
<div class="card-media" id="cm-${p.id}" onclick="openModal(${p.id})" ontouchstart="touchStart(event,${p.id})" ontouchend="touchEnd(event,${p.id})">
  <div class="track" id="track-${p.id}">
    ${p.media.map(m=>`<div class="slide">${m.type==='video'?`<video src="${m.src}" muted></video>`:`<img src="${m.src}" loading="lazy">`}</div>`).join('')}
  </div>
  <div class="card-badge">${total>1?'• '+total+' fotos':''}</div>
  ${dots}${arrows}
</div>
<div class="card-body" onclick="openModal(${p.id})"><div class="card-price">$${p.price.toLocaleString('es-AR')}</div><div class="card-name">${p.name}</div><div class="card-store"><img src="${st.profile||'https://via.placeholder.com/40'}">${p.store}</div></div></div>`;
}).join('')||`<div style="grid-column:1/-1;text-align:center;padding:60px;background:#fff;border-radius:16px;color:#888">Sin productos en Sheet</div>`;

// TIENDAS: solo las que tienen productos reales en Sheet, no todo marketStores
let tiendasConProd = {};
DB.forEach(p=>{ tiendasConProd[p.storeId]= tiendasConProd[p.storeId]||{name:p.store, profile: getStores()[p.storeId]?.profile||'', count:0}; tiendasConProd[p.storeId].count++; });
document.getElementById('storeList').innerHTML=Object.entries(tiendasConProd).map(([id,s])=>`<div class="store-mini" onclick="location.href='store.html?store=${id}'"><img src="${s.profile||'https://via.placeholder.com/40'}"><div><b>${s.name}</b><span>${s.count} prod • Tres Arroyos</span></div></div>`).join('')||'<div style="font-size:11px;color:#999">Sin tiendas aún</div>';
all.forEach(p=> iniciarAuto(p.id));
}

function iniciarAuto(id){
  carIdx[id]=carIdx[id]||0;
  if(carTimers[id]) clearInterval(carTimers[id]);
  let p=DB.find(x=>x.id===id);
  if(!p || p.media.length<=1) return;
  carTimers[id]=setInterval(()=> moverCard(id,1), 3500);
}
function moverCard(id,dir){
  let p=DB.find(x=>x.id===id);
  if(!p) return;
  let total=p.media.length;
  carIdx[id]=((carIdx[id]||0)+dir+total)%total;
  let track=document.getElementById('track-'+id);
  if(track) track.style.transform=`translateX(-${carIdx[id]*100}%)`;
  let dots=document.getElementById('dots-'+id);
  if(dots) [...dots.children].forEach((d,k)=> d.className=k===carIdx[id]?'dot on':'dot');
}
let touchX={};
function touchStart(e,id){ touchX[id]=e.touches[0].clientX; clearInterval(carTimers[id]); }
function touchEnd(e,id){
  let start=touchX[id]; if(start==null) return;
  let end=e.changedTouches[0].clientX;
  if(end-start>50) moverCard(id,-1);
  if(start-end>50) moverCard(id,1);
  iniciarAuto(id);
}
function openModal(id){let p=DB.find(x=>x.id===id);if(!p) return;curProd=p;curIdx=0;let st=getStores()[p.storeId];document.getElementById('mStore').textContent=p.store;document.getElementById('mStoreImg').src=st?st.profile:'';document.getElementById('mPrice').textContent='$'+p.price.toLocaleString('es-AR');document.getElementById('mName').textContent=p.name;document.getElementById('mDesc').textContent=p.desc||'';showModalMedia();document.getElementById('checkout').classList.add('hidden');document.getElementById('modal').style.display='flex';updateResumen();}
function showModalMedia(){let media=curProd.media||[{type:'img',src:curProd.img}];let m=media[curIdx];document.getElementById('modalMedia').innerHTML=`${m.type==='video'?`<video src="${m.src}" controls autoplay style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${m.src}" style="width:100%;height:100%;object-fit:contain">`}${media.length>1?`<div class="arrow l" onclick="event.stopPropagation();curIdx=(curIdx-1+media.length)%media.length;showModalMedia()">‹</div><div class="arrow r" onclick="event.stopPropagation();curIdx=(curIdx+1)%media.length;showModalMedia()">›</div>`:''}`;}
function closeModal(){document.getElementById('modal').style.display='none';}
function contactWsp(){let s=getStores()[curProd.storeId]||{wsp:''};let msg=encodeURIComponent(`Hola! Vi ${curProd.name} por $${curProd.price} en 3A VENDE`);window.open(`https://wa.me/54${(s.wsp||'').replace(/\D/g,'')}?text=${msg}`,'_blank');}
function goStore(){location.href='store.html?store='+curProd.storeId;}
function abrirCheckout(){document.getElementById('checkout').classList.remove('hidden');updateResumen();}
function updateResumen(){let cant=parseInt(document.getElementById('cCant')?.value||'1');let total=(curProd?curProd.price*cant:0);let el=document.getElementById('cResumen');if(el) el.textContent='Total: $'+total.toLocaleString('es-AR')+' x '+cant;}
document.getElementById('cCant')?.addEventListener('input',updateResumen);
function enviarPedidoWsp(){
 let nombre=document.getElementById('cNombre').value.trim();
 let wspCli=document.getElementById('cWsp').value.trim();
 let cant=parseInt(document.getElementById('cCant').value)||1;
 let entrega=document.getElementById('cEntrega').value;
 let dir=document.getElementById('cDir').value.trim();
 let pago=document.getElementById('cPago').value;
 let nota=document.getElementById('cNota').value.trim();
 if(!nombre||!wspCli){alert('Falta dato');return;}
 let s=getStores()[curProd.storeId]||{wsp:'',name:curProd.store};
 let total=curProd.price*cant;
 let pedidoId=Date.now();
 let pedidos=getPedidos();pedidos.push({id:pedidoId,storeId:curProd.storeId,producto:curProd.name,cantidad:cant,total:total,cliente:nombre,clienteWsp:wspCli,entrega:entrega,direccion:dir,pago:pago,nota:nota,fecha:Date.now(),estado:'nuevo'});setPedidos(pedidos);
 let msg=`🛒 PEDIDO ${curProd.name} x${cant} $${total} Cliente:${nombre}`;
 window.open(`https://wa.me/54${(s.wsp||'').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
 enviarASheet({tipo:'pedido',id:pedidoId,storeId:curProd.storeId,tienda:curProd.store,whatsapp:s.wsp,producto:curProd.name,precio:curProd.price,cantidad:cant,total:total,cliente:nombre,clienteWsp:wspCli,entrega:entrega,direccion:dir,pago:pago,nota:nota,fecha:new Date().toLocaleString('es-AR'),estado:'nuevo'});
 closeModal();
}
async function syncDesdeSheet(){
  try{
    document.getElementById('syncStatus').textContent='↻ Leyendo Sheet...';
    let t=Date.now();
    let data = await fetch(SHEET_URL+"?tipo=producto&t="+t).then(r=>r.json());
    let borr = await fetch(SHEET_URL+"?tipo=borrado&t="+t).then(r=>r.json()).catch(()=>[]);
    let borrados = new Set(borr.map(x=>String(x.id)));
    DB = data.filter(x=> x.id && x.imagen &&!borrados.has(String(x.id))).map(x=>{
      let raw = String(x.imagen||'').trim();
      let sep = raw.includes('|||')? '|||' : ',';
      let lista = raw.split(sep).map(s=>s.trim()).filter(s=>s.length>10).map(src=> ({type: src.toLowerCase().includes('.mp4')?'video':'img', src: src}));
      return {
        id: parseInt(x.id),
        storeId: x.storeId,
        store: x.tienda,
        name: x.producto,
        price: parseInt(x.precio)||0,
        category: x.categoria||'Otros',
        desc: x.descripcion||'',
        img: lista[0]?.src||'',
        media: lista.length? lista : [{type:'img', src: raw}],
        created: Date.now()
      };
    });
    render();
    document.getElementById('syncStatus').textContent = '✅ '+DB.length+' del Sheet';
  }catch(e){
    document.getElementById('syncStatus').textContent='❌ Error: '+e.message;
  }
}
updatePanelBtn();
render();
setTimeout(syncDesdeSheet, 800);
</script>
</body>
</html>
