<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Proxima Nova,Arial,sans-serif}
body{background:#f5f5f5;color:#333}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px;cursor:pointer}.logo b{color:#00a650}
.btn{border:none;padding:8px 16px;border-radius:6px;font-weight:700;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}
.btn-gray{background:#f5f5f5;border:1px solid #e5e5e5}
.cover{width:100%;height:220px;background:#ddd;position:relative;overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover}
.profile-bar{max-width:1220px;margin:0 auto;padding:0 16px;position:relative}
.profile-card{background:#fff;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08);padding:16px;display:flex;gap:14px;align-items:center;margin-top:-40px;position:relative}
.profile-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.store-info h1{font-size:20px;font-weight:800}
.store-info p{font-size:12px;color:#888;margin-top:2px}
.actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.main{max-width:1220px;margin:16px auto;padding:0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:12px}
.card{background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer;transition:.2s}
.card:hover{box-shadow:0 6px 18px rgba(0,0,0,.12);transform:translateY(-2px)}
.card img{width:100%;height:190px;object-fit:cover}
.card-body{padding:10px}
.price{font-size:18px;font-weight:700}
.name{font-size:13px;color:#555;margin-top:4px;min-height:32px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.modal-box{background:#fff;border-radius:12px;max-width:1000px;width:100%;display:grid;grid-template-columns:1fr 340px;overflow:hidden;position:relative;max-height:90vh}
.close{position:absolute;top:10px;right:10px;width:32px;height:32px;background:#f5f5f5;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10}
.car{position:relative;background:#000;height:500px;display:flex;align-items:center;justify-content:center}
.car img{width:100%;height:100%;object-fit:contain;display:none;position:absolute;inset:0}.car img.active{display:block}
.dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.d{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.4)}.d.active{background:#00a650}
.info{padding:20px;overflow-y:auto}
.btn-mp{background:#00a650;color:#fff;border:none;padding:14px;border-radius:999px;width:100%;font-weight:800;font-size:14px;cursor:pointer;margin-top:14px}
.btn-mp2{background:#f5f5f5;border:1px solid #e5e5e5;padding:12px;border-radius:999px;width:100%;font-weight:700;margin-top:8px;cursor:pointer}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
@media(max-width:800px){.modal-box{grid-template-columns:1fr}.car{height:360px}.grid{grid-template-columns:repeat(2,1fr)}.profile-card{flex-direction:column;align-items:flex-start}.actions{margin-left:0}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='index.html'">Volver</button><button class="btn btn-green" onclick="location.href='panel.html'">VENDER</button></div>
</header>

<div class="cover"><img id="coverImg" src=""></div>
<div class="profile-bar">
<div class="profile-card">
<img id="profileImg" src="">
<div class="store-info"><h1 id="storeName">Cargando...</h1><p id="storeDir"></p><p id="storeCount" style="color:#00a650;font-weight:700"></p></div>
<div class="actions"><button class="btn btn-green" id="btnWsp" onclick="contactar()">WhatsApp</button><button class="btn btn-gray" onclick="location.href='panel.html'">Editar tienda</button></div>
</div>
</div>

<div class="main"><div class="grid" id="grid"></div></div>

<div class="modal" id="modal">
<div class="modal-box">
<div class="close" onclick="closeModal()">✕</div>
<div class="car" id="car"><div class="dots" id="dots"></div></div>
<div class="info">
<h2 id="mName" style="font-size:18px;font-weight:700"></h2>
<div id="mPrice" style="font-size:24px;font-weight:800;margin-top:8px"></div>
<div id="mDesc" style="font-size:13px;color:#666;margin-top:8px"></div>
<div style="margin-top:14px;display:flex;gap:10px;align-items:center;background:#f5f5f5;padding:10px;border-radius:10px"><img id="mStoreImg" style="width:36px;height:36px;border-radius:50%"><div><b id="mStoreName" style="font-size:12px"></b><div id="mStoreDir" style="font-size:11px;color:#999"></div></div></div>
<button class="btn-mp" onclick="contactar()">Consultar por WhatsApp</button>
<button class="btn-mp2" onclick="closeModal()">Cerrar</button>
<div id="catTitle" style="font-size:12px;font-weight:700;margin-top:18px"></div>
<div class="mini" id="mini"></div>
</div>
</div>
</div>

<script>
function getStores(){return JSON.parse(localStorage.getItem('marketStores')||'{}')}
function getProds(){return JSON.parse(localStorage.getItem('marketProductsAR')||'[]')}
let curStoreId=new URLSearchParams(location.search).get('store'), interval=null, currentProds=[], currentStore=null;

function loadStore(){
if(!curStoreId){document.getElementById('storeName').textContent='Tienda no encontrada';return}
let stores=getStores();let s=stores[curStoreId];
if(!s){document.getElementById('storeName').textContent='Tienda no encontrada';return}
currentStore=s;
document.getElementById('storeName').textContent=s.name;
document.getElementById('storeDir').textContent=s.dir||'Tres Arroyos';
document.getElementById('profileImg').src=s.profile||'https://via.placeholder.com/200';
document.getElementById('coverImg').src=s.cover||'https://via.placeholder.com/1200x300';
let all=getProds().filter(p=>p.storeId===curStoreId);
currentProds=all;
document.getElementById('storeCount').textContent=all.length+' productos • Envío Tres Arroyos';
document.getElementById('grid').innerHTML=all.map(p=>`<div class="card" onclick='openModal(${JSON.stringify(p).replace(/'/g,"&#39;")})'><img src="${p.img}"><div class="card-body"><div class="price">$${p.price.toLocaleString('es-AR')}</div><div class="name">${p.name}</div></div></div>`).join('')||'<p style="grid-column:1/-1;text-align:center;color:#999;padding:20px">Esta tienda aún no cargó productos</p>';
}

function openModal(p){
let s=currentStore;
document.getElementById('mName').textContent=p.name;document.getElementById('mPrice').textContent='$ '+p.price.toLocaleString('es-AR');document.getElementById('mDesc').textContent=p.desc||'';document.getElementById('mStoreName').textContent=s.name;document.getElementById('mStoreDir').textContent=s.dir;document.getElementById('mStoreImg').src=s.profile;
let car=document.getElementById('car');[...car.querySelectorAll('img.c')].forEach(e=>e.remove());
currentProds.forEach(it=>{let im=document.createElement('img');im.src=it.img;im.className='c'+(it.id===p.id?' active':'');car.insertBefore(im,document.getElementById('dots'))});
let dots=document.getElementById('dots');dots.innerHTML=currentProds.map((_,i)=>`<div class="d ${currentProds.findIndex(a=>a.id===p.id)===i?'active':''}"></div>`).join('');
let idx=currentProds.findIndex(a=>a.id===p.id);if(idx<0) idx=0;clearInterval(interval);interval=setInterval(()=>{idx=(idx+1)%currentProds.length;car.querySelectorAll('img.c').forEach((im,j)=>im.classList.toggle('active',j===idx));dots.querySelectorAll('.d').forEach((d,j)=>d.classList.toggle('active',j===idx))},2800);
document.getElementById('catTitle').textContent='Más de '+s.name;document.getElementById('mini').innerHTML=currentProds.map(x=>`<div class="card" onclick='openModal(${JSON.stringify(x).replace(/'/g,"&#39;")})'><img src="${x.img}" style="height:80px"><div style="padding:6px"><div style="font-size:11px;font-weight:700">$${x.price.toLocaleString('es-AR')}</div><div style="font-size:10px">${x.name}</div></div></div>`).join('');
document.getElementById('modal').classList.add('active');
}
function closeModal(){document.getElementById('modal').classList.remove('active');clearInterval(interval)}
function contactar(){
if(!currentStore) return;
let wsp=currentStore.wsp||'';
let msg=encodeURIComponent('Hola! Vi tu tienda en 3A VENDE, me interesa consultar');
window.open('https://wa.me/54'+wsp.replace(/\D/g,'')+'?text='+msg,'_blank');
}
loadStore();
</script>
</body>
</html>
