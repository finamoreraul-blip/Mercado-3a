<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tienda - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Proxima Nova,Arial,sans-serif}
body{background:#f5f5f5;color:#333}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.08);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:19px;cursor:pointer}.logo b{color:#00a650}
.btn{border:none;padding:8px 14px;border-radius:8px;font-weight:700;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-gray{background:#fff;border:1px solid #e5e5e5}.btn-black{background:#111;color:#fff}
.cover{height:180px;background:#ddd;background-size:cover;background-position:center;position:relative}
.profile-wrap{max-width:1100px;margin:0 auto;padding:0 16px;position:relative}
.profile-card{background:#fff;border-radius:14px;padding:16px;display:flex;gap:14px;align-items:center;margin-top:-50px;box-shadow:0 4px 20px rgba(0,0,0,.08);position:relative;z-index:2}
.profile-card img{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.p-name{font-size:18px;font-weight:800}.p-dir{font-size:12px;color:#888;margin-top:2px}
.p-actions{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.wrap{max-width:1100px;margin:16px auto;padding:0 16px;display:grid;grid-template-columns:1fr 300px;gap:16px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.06);cursor:pointer}
.card-media{height:200px;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
.card-media img,.card-media video{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px}.card-price{font-weight:800;font-size:14px}.card-name{font-size:12px;margin-top:2px}
.side{background:#fff;border-radius:12px;padding:14px;height:fit-content;position:sticky;top:80px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:16px;max-width:900px;width:100%;max-height:90vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}
.modal-media{background:#000;display:flex;align-items:center;justify-content:center;min-height:400px;position:relative}
.modal-media img,.modal-media video{width:100%;height:100%;object-fit:contain;max-height:70vh}
.modal-body{padding:20px}
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.edit-box{background:#fff;border-radius:14px;padding:22px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
label{font-size:11px;font-weight:700;display:block;margin-top:14px;margin-bottom:4px;color:#444}
input,textarea{width:100%;padding:10px 12px;border:1px solid #e9e9e9;border-radius:8px;font-size:12px;outline:none;background:#fafafa}
.arrow{position:absolute;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.8);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:800}
.arrow.l{left:10px}.arrow.r{right:10px}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.feed{grid-template-columns:repeat(2,1fr)}.modal-box{grid-template-columns:1fr}.p-actions{margin-left:0;margin-top:10px}.profile-card{flex-direction:column;align-items:flex-start}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='index.html'">Marketplace</button><button class="btn btn-green" onclick="location.href='panel.html'">Mi panel</button></div>
</header>

<div class="cover" id="cover"></div>
<div class="profile-wrap">
<div class="profile-card">
<img id="pImg" src="https://via.placeholder.com/200">
<div><div class="p-name" id="pName">Tienda</div><div class="p-dir" id="pDir">Tres Arroyos</div><div style="font-size:11px;color:#00a650;margin-top:4px" id="pStatus"></div></div>
<div class="p-actions">
<button class="btn btn-green" onclick="contactStore()">WhatsApp</button>
<button class="btn btn-black hidden" id="btnEdit" onclick="openEdit()">Editar tienda</button>
<button class="btn btn-gray" onclick="shareStore()">Compartir</button>
</div>
</div>
</div>

<div class="wrap">
<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:13px;font-weight:700"><span id="prodCount">0</span> publicaciones</div><div style="font-size:11px;color:#888" id="trialInfo"></div></div>
<div class="feed" id="feed"></div>
</div>
<div class="side">
<div style="font-weight:800;font-size:13px">Información</div>
<div style="margin-top:10px;font-size:12px"><b>Dirección:</b> <span id="sDir"></span></div>
<div style="margin-top:6px;font-size:12px"><b>WhatsApp:</b> <span id="sWsp"></span></div>
<div style="margin-top:12px;padding-top:12px;border-top:1px solid #eee">
<div style="font-size:11px;color:#888">¿Querés tu tienda así?</div>
<a href="panel.html" style="font-size:12px;color:#00a650;font-weight:700;text-decoration:none">Creá tu tienda - 10 días gratis →</a>
</div>
</div>
</div>

<div class="modal" id="modal" onclick="if(event.target.id==='modal') closeModal()">
<div class="modal-box">
<div class="modal-media" id="modalMedia"></div>
<div class="modal-body">
<div style="display:flex;justify-content:space-between"><b id="mName"></b><div style="cursor:pointer" onclick="closeModal()">✕</div></div>
<div style="font-size:20px;font-weight:800;margin-top:10px" id="mPrice"></div>
<div style="font-size:13px;color:#555;margin-top:10px;white-space:pre-wrap" id="mDesc"></div>
<button class="btn btn-green" style="width:100%;margin-top:16px;padding:12px" onclick="contactProduct()">Consultar por WhatsApp</button>
</div>
</div>
</div>

<div class="edit-modal" id="editModal">
<div class="edit-box">
<h2 style="font-size:16px;font-weight:800">Editar mi tienda</h2>
<label>Nombre de la tienda</label><input id="eName">
<label>Dirección</label><input id="eDir">
<label>WhatsApp</label><input id="eWsp">
<label>Foto de perfil</label><input type="file" id="eProfile" accept="image/*">
<label>Foto de portada</label><input type="file" id="eCover" accept="image/*">
<button class="btn btn-green" style="width:100%;margin-top:16px;padding:12px" onclick="saveEdit()">Guardar cambios</button>
<button class="btn btn-gray" style="width:100%;margin-top:8px" onclick="closeEdit()">Cancelar</button>
</div>
</div>

<script>
function logMov(tipo, accion, detalle){
try{
let logs=JSON.parse(localStorage.getItem('adminLogs')||'[]');
logs.push({id:Date.now(),fecha:new Date().toLocaleString('es-AR'),tipo,accion,detalle,store:localStorage.getItem('currentUser')||'visitante',url:location.pathname+'?store='+curStoreId});
if(logs.length>5000) logs=logs.slice(-5000);
localStorage.setItem('adminLogs',JSON.stringify(logs));
}catch(e){}
}
function getStores(){return JSON.parse(localStorage.getItem('marketStores')||'{}')}
function setStores(s){localStorage.setItem('marketStores',JSON.stringify(s))}
function getProds(){return JSON.parse(localStorage.getItem('marketProductsAR')||'[]')}
function getUsers(){return JSON.parse(localStorage.getItem('marketUsers')||'{}')}

let curStoreId=new URLSearchParams(location.search).get('store');
let curProd=null, curIdx=0;

function isStoreActive(id){
let stores=getStores();let s=stores[id];if(!s) return false;
let now=Date.now();
if(s.paid && s.paidUntil && now < s.paidUntil) return true;
if(s.plan==='comision') return true;
let start=s.trialStart||now;
let diff=Math.floor((now-start)/(1000*60*60*24));
return diff<=10;
}

function loadStore(){
let stores=getStores();let s=stores[curStoreId];
if(!s){document.body.innerHTML='<div style="padding:40px;text-align:center">Tienda no encontrada<br><a href=index.html>Volver</a></div>';return}
document.getElementById('cover').style.backgroundImage=`url(${s.cover})`;
document.getElementById('pImg').src=s.profile;
document.getElementById('pName').textContent=s.name;
document.getElementById('pDir').textContent=s.dir||'Tres Arroyos';
document.getElementById('sDir').textContent=s.dir||'Tres Arroyos';
document.getElementById('sWsp').textContent=s.wsp;

let now=Date.now();let start=s.trialStart||now;let left=10-Math.floor((now-start)/(1000*60*60*24));
if(s.paid && s.paidUntil && now < s.paidUntil){
document.getElementById('pStatus').textContent='✓ Tienda activa - Mensual hasta '+new Date(s.paidUntil).toLocaleDateString('es-AR');
document.getElementById('trialInfo').textContent='Activa mensual';
}else if(s.plan==='comision'){
document.getElementById('pStatus').textContent='✓ Tienda activa - Plan 10% por venta';
document.getElementById('trialInfo').textContent='Plan 10%';
}else if(left>=0){
document.getElementById('pStatus').textContent='Prueba gratis: quedan '+left+' días';
document.getElementById('trialInfo').textContent=left+' días de prueba';
}else{
document.getElementById('pStatus').textContent='Prueba terminada';
document.getElementById('trialInfo').textContent='Prueba terminada';
}

let wsp=localStorage.getItem('currentUser');let users=getUsers();
if(wsp && users[wsp] && users[wsp].storeId===curStoreId){
document.getElementById('btnEdit').classList.remove('hidden');
}

let prods=getProds().filter(p=>p.storeId===curStoreId).sort((a,b)=>b.id-a.id);
document.getElementById('prodCount').textContent=prods.length;
document.getElementById('feed').innerHTML=prods.map(p=>{
let first=p.media?p.media[0]:{type:'img',src:p.img};
let isVideo=first.type==='video';
let count=p.media?p.media.length:(p.imgs?p.imgs.length:1);
return `<div class="card" onclick="openProd(${p.id})">
<div class="card-media">${isVideo?`<video src="${first.src}" muted></video>`:`<img src="${p.imgs?p.imgs[0]:p.img}">`}${count>1?`<div style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;padding:2px 6px;border-radius:999px;font-size:10px">${count} fotos</div>`:''}${isVideo?`<div style="position:absolute;top:6px;left:6px;background:#00a650;color:#fff;padding:3px 6px;border-radius:4px;font-size:9px">VIDEO</div>`:''}</div>
<div class="card-body"><div class="card-price">$${p.price.toLocaleString('es-AR')}</div><div class="card-name">${p.name}</div></div>
</div>`;
}).join('')||'<div style="text-align:center;color:#888;padding:30px">Esta tienda aún no tiene publicaciones</div>';

logMov('TIENDA','ver_tienda','Vio tienda: '+s.name+' ('+prods.length+' productos)');
}

function openProd(id){
let p=getProds().find(x=>x.id===id);if(!p) return;curProd=p;curIdx=0;
document.getElementById('mName').textContent=p.name;
document.getElementById('mPrice').textContent='$'+p.price.toLocaleString('es-AR');
document.getElementById('mDesc').textContent=p.desc||'Sin descripción';
showMedia();
document.getElementById('modal').style.display='flex';
logMov('TIENDA','ver_producto_tienda',p.name+' $'+p.price);
}
function showMedia(){
let media=curProd.media|| (curProd.imgs?curProd.imgs.map(src=>({type:'img',src})): [{type:'img',src:curProd.img}]);
let m=media[curIdx];
document.getElementById('modalMedia').innerHTML=`
${m.type==='video'?`<video src="${m.src}" controls autoplay style="width:100%;height:100%;object-fit:contain"></video>`:`<img src="${m.src}" style="width:100%;height:100%;object-fit:contain">`}
${media.length>1?`<div class="arrow l" onclick="event.stopPropagation();curIdx=(curIdx-1+media.length)%media.length;showMedia()">‹</div><div class="arrow r" onclick="event.stopPropagation();curIdx=(curIdx+1)%media.length;showMedia()">›</div><div style="position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px">${curIdx+1}/${media.length}</div>`:''}
`;
}
function closeModal(){document.getElementById('modal').style.display='none';}
function contactStore(){
let s=getStores()[curStoreId];
logMov('TIENDA','click_whatsapp_tienda','WhatsApp a tienda '+s.name);
window.open(`https://wa.me/54${s.wsp.replace(/\D/g,'')}?text=${encodeURIComponent('Hola! Vi tu tienda '+s.name+' en 3A VENDE')}`,'_blank');
}
function contactProduct(){
let s=getStores()[curStoreId];
logMov('TIENDA','click_whatsapp_producto','WhatsApp por '+curProd.name);
window.open(`https://wa.me/54${s.wsp.replace(/\D/g,'')}?text=${encodeURIComponent('Hola! Vi '+curProd.name+' por $'+curProd.price+' en tu tienda '+s.name+' de 3A VENDE')}`,'_blank');
}
function shareStore(){
logMov('TIENDA','compartir_tienda','Compartió '+curStoreId);
if(navigator.share){navigator.share({title:getStores()[curStoreId].name,url:location.href})}else{prompt('Copiá link:',location.href)}
}

function openEdit(){
let s=getStores()[curStoreId];
document.getElementById('eName').value=s.name;
document.getElementById('eDir').value=s.dir;
document.getElementById('eWsp').value=s.wsp;
document.getElementById('editModal').style.display='flex';
}
function closeEdit(){document.getElementById('editModal').style.display='none';}
function toBase64(f,cb){let r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}
document.getElementById('eProfile').addEventListener('change',e=>{
let f=e.target.files[0];if(!f) return;
toBase64(f,b64=>{
let stores=getStores();stores[curStoreId].profile=b64;setStores(stores);document.getElementById('pImg').src=b64;
logMov('TIENDA','editar_tienda','Cambió foto perfil');
});
});
document.getElementById('eCover').addEventListener('change',e=>{
let f=e.target.files[0];if(!f) return;
toBase64(f,b64=>{
let stores=getStores();stores[curStoreId].cover=b64;setStores(stores);document.getElementById('cover').style.backgroundImage=`url(${b64})`;
logMov('TIENDA','editar_tienda','Cambió portada');
});
});
function saveEdit(){
let stores=getStores();let s=stores[curStoreId];
let oldName=s.name;
s.name=document.getElementById('eName').value.trim();
s.dir=document.getElementById('eDir').value.trim();
s.wsp=document.getElementById('eWsp').value.trim();
setStores(s);
let users=getUsers();let wsp=localStorage.getItem('currentUser');
if(wsp && users[wsp]){users[wsp].storeName=s.name;localStorage.setItem('marketUsers',JSON.stringify(users));}
logMov('TIENDA','editar_tienda','Editó tienda: '+oldName+' -> '+s.name+' | '+s.dir+' | '+s.wsp);
closeEdit();loadStore();
}

loadStore();
</script>
</body>
</html>
