<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f3f5}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.logo b{color:#00a650}
.btn{border:none;padding:10px 16px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-black{background:#111;color:#fff}.btn-gray{background:#fff;border:1px solid #ddd}
.cover{height:220px;background:#222;background-size:cover;background-position:center;position:relative}
.cover-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;flex-direction:column}
.profile-wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.profile-card{max-width:1100px;margin:-60px auto 0;background:#fff;border-radius:20px;padding:20px;display:flex;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.12);position:relative;z-index:2}
.pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #fff;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-size:22px;font-weight:900}
.p-dir{font-size:13px;color:#777;margin-top:3px}
.p-desc{font-size:13px;color:#333;margin-top:10px;background:#f9fafb;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.4}
.p-status{font-size:11px;color:#00a650;background:#e6f7ed;padding:6px 12px;border-radius:999px;font-weight:800;margin-top:8px;display:inline-block}
.p-actions{display:flex;flex-direction:column;gap:8px;min-width:140px}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:1fr 320px;gap:16px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s;cursor:pointer}
.prod:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.prod-media{height:200px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-media img{width:100%;height:100%;object-fit:cover}
.prod-body{padding:12px}
.prod-price{font-weight:900;font-size:16px}
.prod-name{font-size:13px;margin-top:3px;color:#222;line-height:1.3}
.side{background:#fff;border-radius:16px;padding:18px;height:fit-content;position:sticky;top:70px;border:1px solid #eee}
.side-item{font-size:13px;margin-top:10px;line-height:1.5}
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.edit-box{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
label{font-size:11px;font-weight:800;display:block;margin-top:14px;margin-bottom:5px;text-transform:uppercase;letter-spacing:.3px}
input,textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#fafafa;outline:none}
textarea{height:75px;resize:none}
.upload{border:2px dashed #ccc;border-radius:12px;padding:12px;text-align:center;margin-top:6px;cursor:pointer;background:#fafafa}
.upload img{width:72px;height:72px;border-radius:50%;display:none;margin:8px auto 0;object-fit:cover;border:3px solid #fff}
.upload-cover{height:90px;border-radius:10px;background-size:cover;background-position:center;display:none;margin-top:8px;border:1px solid #eee}
.hidden{display:none!important}
.owner-only{display:none}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.profile-card{flex-direction:column}.p-actions{flex-direction:row;flex-wrap:wrap}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='index.html'">Marketplace</button><button class="btn btn-green" onclick="location.href='panel.html'">Panel</button></div>
</header>

<div class="cover" id="cover"><div class="cover-empty" id="coverEmpty">Sin portada</div></div>

<div class="profile-wrap">
<div class="profile-card">
<img id="pImg" class="pfp" src="https://via.placeholder.com/200">
<div class="p-info">
<div class="p-name" id="pName">Mi tienda</div>
<div class="p-dir" id="pDir">📍 Tres Arroyos</div>
<div class="p-desc" id="pDesc"></div>
<div class="p-status" id="pStatus">↻ Conectando Sheet...</div>
<div style="font-size:10px;color:#aaa;margin-top:6px">ID: <span id="idShow"></span> • <span id="ownerTag"></span></div>
</div>
<div class="p-actions">
<button class="btn btn-black owner-only" id="btnEdit" onclick="abrirEdit()">✏️ EDITAR TIENDA</button>
<button class="btn btn-green" onclick="contactar()">💬 WhatsApp</button>
<button class="btn btn-gray" onclick="compartir()">↗ Compartir</button>
</div>
</div>
</div>

<div class="wrap">
<div>
<div class="section-title">
<h3 style="font-size:16px;font-weight:900">Publicaciones (<span id="prodCount">0</span>)</h3>
<span id="info" style="font-size:11px;color:#888;background:#fff;padding:6px 12px;border-radius:999px;border:1px solid #eee">Sheet</span>
</div>
<div class="feed" id="feed"></div>
</div>

<div class="side">
<div style="font-weight:900;font-size:14px">Información</div>
<div class="side-item"><b>Nombre:</b> <span id="sName"></span></div>
<div class="side-item"><b>Dirección:</b> <span id="sDir"></span></div>
<div class="side-item"><b>WhatsApp:</b> <span id="sWsp"></span></div>
<div class="side-item" style="margin-top:12px"><b>Descripción:</b><div id="sDesc" style="color:#555;margin-top:6px;white-space:pre-wrap;background:#f9fafb;padding:10px;border-radius:10px;line-height:1.4"></div></div>
</div>
</div>

<div class="edit-modal" id="editModal">
<div class="edit-box">
<h2 style="font-weight:900;font-size:18px">Editar mi tienda</h2>
<p style="font-size:11px;color:#00a650;margin-top:4px">🔒 Solo el dueño puede editar</p>
<label>Nombre *</label><input id="eName">
<label>Descripción</label><textarea id="eDesc"></textarea>
<label>Dirección</label><input id="eDir">
<label>WhatsApp *</label><input id="eWsp" disabled style="background:#eee">
<label>Foto perfil</label>
<div class="upload" onclick="document.getElementById('filePerfil').click()">
<div style="font-weight:800;font-size:12px">📸 SUBIR FOTO PERFIL</div><img id="prevPerfil">
</div>
<input type="file" id="filePerfil" accept="image/*" class="hidden">
<label>Portada</label>
<div class="upload" onclick="document.getElementById('filePortada').click()">
<div style="font-weight:800;font-size:12px">🖼️ SUBIR PORTADA</div><div id="prevPortada" class="upload-cover"></div>
</div>
<input type="file" id="filePortada" accept="image/*" class="hidden">
<button class="btn btn-green" style="width:100%;margin-top:18px;padding:14px" onclick="guardar()">💾 GUARDAR</button>
<button class="btn btn-gray" style="width:100%;margin-top:8px" onclick="cerrarEdit()">Cancelar</button>
</div>
</div>

<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyb_1T-3wAcKsBIYhW6XSissrzcs0nGbFWvY83YN6l9vuNBzNQrhBqdntvKbESh1v52aQ/exec";
function enviarASheet(d){ try{ fetch(SHEET_URL,{method:'POST',mode:'no-cors',body:JSON.stringify(d)}); }catch(e){} }

var curId=null,tempPerfil=null,tempPortada=null, esDueño=false;
function getStores(){try{return JSON.parse(localStorage.getItem('marketStores')||'{}')}catch(e){return{}}}
function setStores(o){localStorage.setItem('marketStores',JSON.stringify(o))}
function getUsers(){try{return JSON.parse(localStorage.getItem('marketUsers')||'{}')}catch(e){return{}}}

(function(){
 var u=new URLSearchParams(location.search);
 curId=u.get('store');
 if(!curId){
   curId=localStorage.getItem('currentStoreId');
   if(!curId){
     var w=localStorage.getItem('currentUser');var us=getUsers();
     if(w&&us[w]&&us[w].storeId) curId=us[w].storeId;
     else{var st=getStores();var k=Object.keys(st);if(k.length>0) curId=k[0];}
   }
   if(curId) history.replaceState(null,'','store.html?store='+curId);
 }
})();

async function getSheet(tipo){
 try{
   let r=await fetch(SHEET_URL+"?tipo="+tipo+"&t="+Date.now());
   let t=await r.text();
   return JSON.parse(t);
 }catch(e){return [];}
}

function parseMedia(raw){
 let r=String(raw||'').trim();
 if(!r) return [];
 let sep = r.includes('|||')? '|||' : ',';
 if(r.includes('data:image') && r.length>1000 &&!r.includes('|||')) return [{type:'img',src:r}];
 let arr=r.split(sep).map(s=>s.trim()).filter(s=>s.length>15);
 return arr.map(src=>({type: src.toLowerCase().includes('.mp4')?'video':'img', src}));
}

async function cargar(){
 if(!curId){document.body.innerHTML='<div style="padding:40px;text-align:center">Falta ID</div>';return;}
 var stores=getStores();var sLocal=stores[curId];

 let tiendas=await getSheet('tienda');
 let borradasT=await getSheet('borrado_tienda');
 let setBorT=new Set(borradasT.map(x=>String(x.storeId||x.id)));
 let tSheet=tiendas.find(x=>String(x.storeId)===String(curId) &&!setBorT.has(String(x.storeId)));

 let s = tSheet? {
   id:tSheet.storeId, name:tSheet.tienda, wsp:String(tSheet.whatsapp||''), dir:tSheet.direccion,
   descStore:tSheet.descripcion||'', profile:tSheet.foto||sLocal?.profile||'',
   cover:tSheet.portada||sLocal?.cover||'', ownerWsp:String(tSheet.whatsapp||'')
 } : sLocal;

 if(!s){document.body.innerHTML='<div style="padding:40px;text-align:center">Tienda no encontrada</div>';return;}

 // === VERIFICAR DUEÑO ===
 let currentWsp = (localStorage.getItem('currentUser')||'').replace(/\D/g,'');
 esDueño = String(s.wsp||s.ownerWsp||'').replace(/\D/g,'') === currentWsp && currentWsp!=='';

 if(esDueño){
   document.querySelectorAll('.owner-only').forEach(el=>el.style.display='block');
   document.getElementById('ownerTag').innerHTML='<span style="background:#00a650;color:#fff;padding:2px 6px;border-radius:999px">SOS DUEÑO - Podés editar</span>';
 } else {
   document.getElementById('ownerTag').innerHTML='<span style="background:#eee;color:#888;padding:2px 6px;border-radius:999px">Solo vista</span>';
 }

 stores[curId]={...sLocal,...s, id:curId}; setStores(stores);

 document.getElementById('idShow').textContent=s.id;
 document.getElementById('pName').textContent=s.name||'Mi tienda';
 document.getElementById('pDir').textContent='📍 '+(s.dir||'Tres Arroyos');
 document.getElementById('pDesc').textContent=s.descStore||'';
 document.getElementById('pDesc').style.display=(s.descStore)?'block':'none';
 document.getElementById('sName').textContent=s.name||'-';
 document.getElementById('sDir').textContent=s.dir||'-';
 document.getElementById('sWsp').textContent=s.wsp||'-';
 document.getElementById('sDesc').textContent=s.descStore||'Sin descripción';
 document.getElementById('pImg').src=s.profile||'https://via.placeholder.com/200?text='+encodeURIComponent(s.name||'3A');
 if(s.cover){document.getElementById('cover').style.backgroundImage='url('+s.cover+')';document.getElementById('coverEmpty').style.display='none'}

 document.getElementById('pStatus').textContent= esDueño? '✅ Sos el dueño' : '👀 Viendo como cliente';
 document.getElementById('info').textContent='Leyendo productos...';

 let prods=await getSheet('producto');
 let borrados=await getSheet('borrado');
 let setBor=new Set(borrados.map(x=>String(x.id)));
 let misProds=prods.filter(p=>String(p.storeId)===String(curId) &&!setBor.has(String(p.id)));

 document.getElementById('prodCount').textContent=misProds.length;
 document.getElementById('info').textContent='✅ '+misProds.length+' del Sheet';

 let html='';
 for(let p of misProds){
   let media=parseMedia(p.imagen);
   let img=media[0]?.src||'https://via.placeholder.com/300';
   let total=media.length;
   html+=`<div class="prod"><div class="prod-media"><img src="${img}" loading="lazy"><div style="position:absolute;bottom:6px;right:6px;background:rgba(0,0,0,.7);color:#fff;padding:3px 7px;border-radius:999px;font-size:10px">${total>1? total+' fotos':''}</div></div><div class="prod-body"><div class="prod-price">$${(parseInt(p.precio)||0).toLocaleString('es-AR')}</div><div class="prod-name">${p.producto}</div></div></div>`;
 }
 document.getElementById('feed').innerHTML=html||'<div style="grid-column:1/-1;background:#fff;padding:40px;border-radius:16px;text-align:center;color:#888">Sin publicaciones</div>';
}

function abrirEdit(){
 if(!esDueño){ alert('Solo el dueño puede editar esta tienda'); return; }
 var s=getStores()[curId];document.getElementById('eName').value=s.name||'';document.getElementById('eDir').value=s.dir||'';document.getElementById('eWsp').value=s.wsp||'';document.getElementById('eDesc').value=s.descStore||'';tempPerfil=null;tempPortada=null;document.getElementById('prevPerfil').style.display='none';document.getElementById('prevPortada').style.display='none';document.getElementById('editModal').style.display='flex';
}
function cerrarEdit(){document.getElementById('editModal').style.display='none'}
function toBase64(f,cb){var r=new FileReader();r.onload=function(e){cb(e.target.result)};r.readAsDataURL(f)}
document.getElementById('filePerfil').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;toBase64(f,function(b){tempPerfil=b;var img=document.getElementById('prevPerfil');img.src=b;img.style.display='block';document.getElementById('pImg').src=b})});
document.getElementById('filePortada').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;toBase64(f,function(b){tempPortada=b;var d=document.getElementById('prevPortada');d.style.backgroundImage='url('+b+')';d.style.display='block';document.getElementById('cover').style.backgroundImage='url('+b+')';document.getElementById('coverEmpty').style.display='none'})});
function guardar(){
if(!esDueño){ alert('No sos dueño'); return; }
var stores=getStores();var s=stores[curId];
var nn=document.getElementById('eName').value.trim();var nd=document.getElementById('eDir').value.trim();var nw=document.getElementById('eWsp').value.trim().replace(/\D/g,'');var de=document.getElementById('eDesc').value.trim();
if(!nn){alert('Nombre');return}
s.name=nn;if(nd)s.dir=nd;if(nw)s.wsp=nw;s.descStore=de;if(tempPerfil)s.profile=tempPerfil;if(tempPortada)s.cover=tempPortada;
setStores(stores);
enviarASheet({tipo:'tienda',storeId:curId,tienda:nn,whatsapp:nw||s.wsp,direccion:nd,descripcion:de,foto:tempPerfil||'',portada:tempPortada||''});
cerrarEdit();cargar();alert('Guardado');
}
function contactar(){var s=getStores()[curId];window.open('https://wa.me/54'+(s.wsp||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Hola! Vi tu tienda '+s.name),'_blank')}
function compartir(){if(navigator.share)navigator.share({title:getStores()[curId].name,url:location.href});else prompt('Copiá:',location.href)}
window.onload=cargar;
</script>
</body>
</html>
