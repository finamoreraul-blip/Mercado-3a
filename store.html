<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Tienda - 3A VENDE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f2f3f5}
header{background:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 3px rgba(0,0,0,.1);position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.logo b{color:#00a650}
.btn{border:none;padding:10px 16px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer}
.btn-green{background:#00a650;color:#fff}.btn-black{background:#111;color:#fff}.btn-gray{background:#fff;border:1px solid #ddd}
.cover{height:240px;background:#222;background-size:cover;background-position:center;position:relative}
.cover-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#888;font-size:12px;flex-direction:column}
.profile-wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.profile-card{max-width:1100px;margin:-60px auto 0;background:#fff;border-radius:20px;padding:20px;display:flex;gap:18px;box-shadow:0 12px 32px rgba(0,0,0,.12);position:relative;z-index:2}
.pfp{width:90px;height:90px;border-radius:50%;object-fit:cover;border:4px solid #fff;flex-shrink:0}
.p-info{flex:1;min-width:0}
.p-name{font-size:22px;font-weight:900}
.p-dir{font-size:13px;color:#777;margin-top:3px}
.p-desc{font-size:13px;color:#333;margin-top:10px;background:#f9fafb;padding:10px 12px;border-radius:10px;white-space:pre-wrap;line-height:1.4}
.p-status{font-size:11px;color:#00a650;background:#e6f7ed;padding:6px 12px;border-radius:999px;font-weight:800;margin-top:8px;display:inline-block}
.p-actions{display:flex;flex-direction:column;gap:8px;min-width:160px}
.wrap{max-width:1100px;margin:20px auto;padding:0 16px;display:grid;grid-template-columns:1fr 320px;gap:16px}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.prod{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #eee;transition:.2s;cursor:pointer}
.prod:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.1)}
.prod-media{height:200px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.prod-media img{width:100%;height:100%;object-fit:cover}
.prod-body{padding:12px}
.prod-price{font-weight:900;font-size:16px}
.prod-name{font-size:13px;margin-top:3px;color:#222;line-height:1.3;height:32px;overflow:hidden}
.side{background:#fff;border-radius:16px;padding:18px;height:fit-content;position:sticky;top:70px;border:1px solid #eee}
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.edit-box{background:#fff;border-radius:18px;padding:22px;max-width:440px;width:100%;max-height:92vh;overflow:auto}
label{font-size:11px;font-weight:800;display:block;margin-top:14px;margin-bottom:5px;text-transform:uppercase}
input,textarea{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:10px;font-size:13px;background:#fafafa}
textarea{height:75px;resize:none}
.upload{border:2px dashed #ccc;border-radius:12px;padding:12px;text-align:center;margin-top:6px;cursor:pointer;background:#fafafa}
.upload img{width:72px;height:72px;border-radius:50%;display:none;margin:8px auto 0;object-fit:cover}
.upload-cover{height:90px;border-radius:10px;background-size:cover;background-position:center;display:none;margin-top:8px}
.hidden{display:none!important}
.owner-only{display:none}
.m-dots{width:6px;height:6px;border-radius:999px;background:#ccc}.m-dots.on{width:18px;background:#111}
@media(max-width:900px){.wrap{grid-template-columns:1fr}.profile-card{flex-direction:column}.m-grid{grid-template-columns:1fr!important}}
</style>
</head>
<body>
<header>
<div class="logo" onclick="location.href='index.html'"><b>3A</b> VENDE</div>
<div style="display:flex;gap:8px"><button class="btn btn-gray" onclick="location.href='index.html'">Marketplace</button><button class="btn btn-green" onclick="location.href='panel.html'">Panel</button></div>
</header>
<div class="cover" id="cover"><div class="cover-empty" id="coverEmpty">Sin portada</div></div>
<div class="profile-wrap">
<div class="profile-card">
<img id="pImg" class="pfp" src="https://via.placeholder.com/200">
<div class="p-info">
<div class="p-name" id="pName">Mi tienda</div>
<div class="p-dir" id="pDir">📍 Tres Arroyos</div>
<div class="p-desc" id="pDesc"></div>
<div class="p-status" id="pStatus">↻ Conectando...</div>
<div style="font-size:10px;color:#aaa;margin-top:6px">ID: <span id="idShow"></span> • <span id="ownerTag"></span></div>
</div>
<div class="p-actions">
<button class="btn btn-black owner-only" onclick="abrirEdit()">✏️ EDITAR TIENDA</button>
<button class="btn btn-green" onclick="contactar()">💬 WhatsApp</button>
<button class="btn btn-gray" onclick="compartir()">↗ Compartir tienda</button>
</div>
</div>
</div>
<div class="wrap">
<div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
<h3 style="font-size:16px;font-weight:900">Publicaciones (<span id="prodCount">0</span>)</h3>
<span id="info" style="font-size:11px;color:#888;background:#fff;padding:6px 12px;border-radius:999px;border:1px solid #eee">Sheet</span>
</div>
<div class="feed" id="feed"></div>
</div>
<div class="side">
<div style="font-weight:900;font-size:14px">Información</div>
<div style="font-size:13px;margin-top:10px"><b>Nombre:</b> <span id="sName"></span></div>
<div style="font-size:13px;margin-top:6px"><b>Dirección:</b> <span id="sDir"></span></div>
<div style="font-size:13px;margin-top:6px"><b>WhatsApp:</b> <span id="sWsp"></span></div>
<div style="font-size:13px;margin-top:12px"><b>Descripción:</b><div id="sDesc" style="color:#555;margin-top:6px;white-space:pre-wrap;background:#f9fafb;padding:10px;border-radius:10px"></div></div>
</div>
</div>
<div class="edit-modal" id="editModal">
<div class="edit-box">
<h2 style="font-weight:900">Editar tienda</h2>
<p style="font-size:11px;color:#00a650">🔒 Fotos protegidas</p>
<label>Nombre *</label><input id="eName">
<label>Descripción</label><textarea id="eDesc"></textarea>
<label>Dirección</label><input id="eDir">
<label>WhatsApp *</label><input id="eWsp" disabled style="background:#eee">
<label>Foto perfil</label><div class="upload" onclick="filePerfil.click()"><div style="font-weight:800;font-size:12px">📸 SUBIR FOTO PERFIL</div><img id="prevPerfil"></div><input type="file" id="filePerfil" accept="image/*" class="hidden">
<label>Portada</label><div class="upload" onclick="filePortada.click()"><div style="font-weight:800;font-size:12px">🖼️ SUBIR PORTADA</div><div id="prevPortada" class="upload-cover"></div></div><input type="file" id="filePortada" accept="image/*" class="hidden">
<button class="btn btn-green" style="width:100%;margin-top:18px;padding:14px" onclick="guardar()">💾 GUARDAR</button>
<button class="btn btn-gray" style="width:100%;margin-top:8px" onclick="cerrarEdit()">Cancelar</button>
</div>
</div>
<div id="prodModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;align-items:center;justify-content:center;padding:16px">
<div class="m-grid" style="background:#fff;border-radius:20px;max-width:820px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr">
<div style="background:#000;position:relative;min-height:420px;display:flex;align-items:center;justify-content:center;overflow:hidden" id="pmMedia"></div>
<div style="padding:22px;display:flex;flex-direction:column">
<div style="display:flex;justify-content:space-between;align-items:center"><b id="pmStore" style="font-size:11px;background:#f5f5f5;padding:6px 10px;border-radius:999px"></b><span onclick="closeProd()" style="background:#f5f5f5;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:900">✕</span></div>
<div id="pmPrice" style="font-size:26px;font-weight:900;margin-top:14px"></div>
<div id="pmName" style="font-weight:800;font-size:16px;margin-top:6px;line-height:1.2"></div>
<div id="pmDesc" style="font-size:13px;color:#555;margin-top:12px;white-space:pre-wrap;line-height:1.5;background:#f9fafb;padding:12px;border-radius:12px"></div>
<div id="pmDots" style="display:flex;gap:6px;justify-content:center;margin-top:14px"></div>
<div style="display:flex;align-items:center;gap:12px;margin-top:16px">
<button onclick="chgQty(-1)" style="width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;font-weight:900">-</button>
<span id="pmQty" style="font-weight:900">1</span>
<button onclick="chgQty(1)" style="width:36px;height:36px;border-radius:50%;border:1px solid #ddd;background:#fff;font-weight:900">+</button>
<span id="pmTotal" style="margin-left:auto;font-weight:900"></span>
</div>
<button onclick="comprarDesdeStore()" style="width:100%;background:#00a650;color:#fff;border:none;padding:16px;border-radius:999px;font-weight:900;margin-top:16px;font-size:14px">🛒 COMPRAR POR WHATSAPP</button>
<button onclick="consultarDesdeStore()" style="width:100%;background:#fff;border:1px solid #ddd;padding:14px;border-radius:999px;font-weight:800;margin-top:8px">💬 Consultar</button>
</div>
</div>
</div>
<script>
const SHEET_URL = "https://script.google.com/macros/s/AKfycbyb_1T-3wAcKsBIYhW6XSissrzcs0nGbFWvY83YN6l9vuNBzNQrhBqdntvKbESh1v52aQ/exec";
function enviarASheet(d){
  fetch(SHEET_URL,{method:'POST',body:JSON.stringify(d)}).then(r=>r.text()).then(t=>console.log(t)).catch(e=>console.error(e));
}
var curId=null,tempPerfil=null,tempPortada=null,esDueño=false,misProdsGlobal=[],curProdStore=null,curProdIdx=0,qty=1;
function getStores(){try{return JSON.parse(localStorage.getItem('marketStores')||'{}')}catch(e){return{}}}
function setStores(o){localStorage.setItem('marketStores',JSON.stringify(o))}
(function(){var u=new URLSearchParams(location.search);curId=u.get('store');if(!curId){curId=localStorage.getItem('currentStoreId');if(curId)history.replaceState(null,'','store.html?store='+curId);}})();
async function getSheet(t){try{let r=await fetch(SHEET_URL+"?tipo="+t+"&t="+Date.now());return JSON.parse(await r.text());}catch(e){return[];}}
function parseMedia(raw){let r=String(raw||'').trim();if(!r)return[];let sep=r.includes('|||')?'|||':',';if(r.includes('data:image')&&r.length>1000&&!r.includes('|||'))return[{src:r}];return r.split(sep).map(s=>s.trim()).filter(s=>s.length>15).map(src=>({src}));}
async function cargar(){
 if(!curId){document.body.innerHTML='Falta ID';return;}
 var stores=getStores();var sLocal=stores[curId];
 let tiendas=await getSheet('tienda');let borT=await getSheet('borrado_tienda');let setBorT=new Set(borT.map(x=>String(x.storeId||x.id)));
 let tSheet=tiendas.find(x=>String(x.storeId)===String(curId)&&!setBorT.has(String(x.storeId)));
 let s=tSheet?{id:tSheet.storeId,name:tSheet.tienda,wsp:String(tSheet.whatsapp||''),dir:tSheet.direccion,descStore:tSheet.descripcion||'',profile:tSheet.foto||sLocal?.profile||'',cover:tSheet.portada||sLocal?.cover||''}:sLocal;
 if(!s){document.body.innerHTML='No encontrada';return;}
 let currentWsp=(localStorage.getItem('currentUser')||'').replace(/\D/g,'');esDueño=String(s.wsp).replace(/\D/g,'')===currentWsp&&currentWsp!=='';
 if(esDueño){document.querySelectorAll('.owner-only').forEach(e=>e.style.display='block');document.getElementById('ownerTag').innerHTML='<span style="background:#00a650;color:#fff;padding:2px 8px;border-radius:999px">SOS DUEÑO</span>';}else{document.getElementById('ownerTag').innerHTML='<span style="background:#eee;padding:2px 8px;border-radius:999px">Solo vista</span>';}
 stores[curId]={...sLocal,...s,id:curId};setStores(stores);
 document.getElementById('idShow').textContent=s.id;document.getElementById('pName').textContent=s.name;document.getElementById('pDir').textContent='📍 '+(s.dir||'Tres Arroyos');document.getElementById('pDesc').textContent=s.descStore||'';document.getElementById('pDesc').style.display=s.descStore?'block':'none';document.getElementById('sName').textContent=s.name;document.getElementById('sDir').textContent=s.dir||'-';document.getElementById('sWsp').textContent=s.wsp||'-';document.getElementById('sDesc').textContent=s.descStore||'-';document.getElementById('pImg').src=s.profile||'https://via.placeholder.com/200?text='+encodeURIComponent(s.name);if(s.cover){document.getElementById('cover').style.backgroundImage='url('+s.cover+')';document.getElementById('coverEmpty').style.display='none'}
 document.getElementById('pStatus').textContent=esDueño?'✅ Sos el dueño':'👀 Cliente viendo';
 let prods=await getSheet('producto');let bor=await getSheet('borrado');let setBor=new Set(bor.map(x=>String(x.id)));
 let misProds=prods.filter(p=>String(p.storeId)===String(curId)&&!setBor.has(String(p.id)));misProdsGlobal=misProds;
 document.getElementById('prodCount').textContent=misProds.length;
 let html='';for(let p of misProds){let media=parseMedia(p.imagen);let img=media[0]?.src||'https://via.placeholder.com/300';html+=`<div class="prod" onclick="openProd(${p.id})"><div class="prod-media"><img src="${img}" loading="lazy"></div><div class="prod-body"><div class="prod-price">$${(parseInt(p.precio)||0).toLocaleString('es-AR')}</div><div class="prod-name">${p.producto}</div></div></div>`;}
 document.getElementById('feed').innerHTML=html||'<div style="grid-column:1/-1;background:#fff;padding:40px;border-radius:16px;text-align:center;color:#888">Sin publicaciones</div>';
}
function openProd(id){let p=misProdsGlobal.find(x=>String(x.id)===String(id));if(!p)return;curProdStore=p;curProdIdx=0;qty=1;document.getElementById('pmStore').textContent=p.tienda;document.getElementById('pmPrice').textContent='$'+(parseInt(p.precio)||0).toLocaleString('es-AR');document.getElementById('pmName').textContent=p.producto;document.getElementById('pmDesc').textContent=p.descripcion||'Sin descripción';document.getElementById('pmQty').textContent=qty;updTotal();showProdMedia();document.getElementById('prodModal').style.display='flex';}
function showProdMedia(){let media=parseMedia(curProdStore.imagen);let m=media[curProdIdx];document.getElementById('pmMedia').innerHTML=`<div style="position:absolute;top:12px;left:12px;background:rgba(0,0,0,.7);color:#fff;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:800;z-index:2">${curProdIdx+1}/${media.length}</div><img src="${m.src}" style="width:100%;height:100%;object-fit:contain;max-height:70vh">${media.length>1?`<button onclick="event.stopPropagation();curProdIdx=(curProdIdx-1+media.length)%media.length;showProdMedia()" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.95);border:none;width:36px;height:36px;border-radius:50%;font-weight:900">‹</button><button onclick="event.stopPropagation();curProdIdx=(curProdIdx+1)%media.length;showProdMedia()" style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.95);border:none;width:36px;height:36px;border-radius:50%;font-weight:900">›</button>`:''}`;document.getElementById('pmDots').innerHTML=media.map((_,k)=>`<div class="m-dots ${k===curProdIdx?'on':''}"></div>`).join('');}
function closeProd(){document.getElementById('prodModal').style.display='none';}
function chgQty(d){qty=Math.max(1,qty+d);document.getElementById('pmQty').textContent=qty;updTotal();}
function updTotal(){let tot=(parseInt(curProdStore.precio)||0)*qty;document.getElementById('pmTotal').textContent='Total $'+tot.toLocaleString('es-AR');}
function comprarDesdeStore(){let s=getStores()[curId];let tot=(parseInt(curProdStore.precio)||0)*qty;let msg=`🛒 *Pedido 3A VENDE*%0ATienda: ${s.name}%0AProducto: ${curProdStore.producto}%0ACantidad: ${qty}%0ATotal: $${tot}`;window.open(`https://wa.me/54${(s.wsp||'').replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');}
function consultarDesdeStore(){let s=getStores()[curId];window.open(`https://wa.me/54${(s.wsp||'').replace(/\D/g,'')}?text=${encodeURIComponent('Hola! Consulta por '+curProdStore.producto)}`,'_blank');}
function abrirEdit(){if(!esDueño){alert('Solo dueño');return;}var s=getStores()[curId];document.getElementById('eName').value=s.name||'';document.getElementById('eDir').value=s.dir||'';document.getElementById('eWsp').value=s.wsp||'';document.getElementById('eDesc').value=s.descStore||'';document.getElementById('editModal').style.display='flex';}
function cerrarEdit(){document.getElementById('editModal').style.display='none';tempPerfil=null;tempPortada=null;}
function toBase64(f,cb){var r=new FileReader();r.onload=e=>cb(e.target.result);r.readAsDataURL(f)}
document.getElementById('filePerfil').addEventListener('change',e=>{var f=e.target.files[0];if(!f)return;toBase64(f,b=>{tempPerfil=b;document.getElementById('prevPerfil').src=b;document.getElementById('prevPerfil').style.display='block';document.getElementById('pImg').src=b})});
document.getElementById('filePortada').addEventListener('change',e=>{var f=e.target.files[0];if(!f)return;toBase64(f,b=>{tempPortada=b;let d=document.getElementById('prevPortada');d.style.backgroundImage='url('+b+')';d.style.display='block';document.getElementById('cover').style.backgroundImage='url('+b+')';document.getElementById('coverEmpty').style.display='none'})});
function guardar(){
  if(!esDueño) return;
  var stores=getStores();var s=stores[curId];
  var nn=document.getElementById('eName').value.trim();
  var nd=document.getElementById('eDir').value.trim();
  var de=document.getElementById('eDesc').value.trim();
  if(!nn){alert('Nombre');return}
  s.name=nn;if(nd)s.dir=nd;s.descStore=de;
  if(tempPerfil)s.profile=tempPerfil;
  if(tempPortada)s.cover=tempPortada;
  setStores(stores);
  var payload={action:'editarTienda',tipo:'tienda',storeId:curId,tienda:nn,whatsapp:s.wsp,direccion:nd,descripcion:de};
  if(tempPerfil && tempPerfil.length>100)payload.foto=tempPerfil;
  if(tempPortada && tempPortada.length>100)payload.portada=tempPortada;
  enviarASheet(payload);
  cerrarEdit();setTimeout(cargar,800);alert('Guardado ✅');
}
function contactar(){var s=getStores()[curId];window.open('https://wa.me/54'+(s.wsp||'').replace(/\D/g,'')+'?text='+encodeURIComponent('Hola! Vi tu tienda '+s.name),'_blank')}
function compartir(){if(navigator.share)navigator.share({title:getStores()[curId].name,url:location.href});else prompt('Copiá:',location.href)}
window.onload=cargar;
</script>
</body>
</html>
